query Countries {
  countries(activeOnly: true) {
    code
    name
    emojiFlag
    # What a business purchase from the country asks for at checkout
    businessIdFields {
      key
      label
      required
      pattern
      hint
    }
  }
}

query Regions($countryCode: String!) {
  regions(countryCode: $countryCode) {
    code
    name
  }
}

query CountrySettings {
  countrySettings {
    defaultCountryCode
    allowOptionalState
    requiredRegionCountryCodes
  }
}

query PhoneSettings {
  phoneSettings {
    restrictedToStoreCountries
    lockedCountryCode
    defaultCountryCode
    formats {
      countryCode
      callingCode
      example
      nationalExample
      template
    }
  }
}
