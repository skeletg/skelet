name: skelet-prod

include:
  - apps/backend/core/compose.yaml
  - apps/backend/signals/compose.yaml

# json-file is UNBOUNDED by default, so a long deployment fills the disk - 10 MB x 3 caps each service at ~30 MB, which
# is also the retention - rotated lines are gone, so durable history means shipping them with your own infrastructure
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Opt-in TLS edge - `--profile edge` - everything else here binds to 127.0.0.1 and expects your own proxy; this is for the deployments that don't have one already
  caddy:
    profiles: ["edge"]
    image: caddy:2-alpine
    env_file: [env/prod-caddy.env] # domains + ACME email only, no secrets at the edge
    environment:
      UPLOAD_ORIGINS: ${UPLOAD_ORIGINS:-}
    ports:
      - "80:80"
      - "443:443"
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/dashboard/dist:/srv/dashboard:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 128m, cpus: "1" }
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
