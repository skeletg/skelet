# Generated into the backend module for now - when Signals becomes its own module this package is
# what both sides import, and only its import path moves
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/skeletg/skelet/apps/backend/internal/signalspb
plugins:
  - local: protoc-gen-go
    out: internal/signalspb
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/signalspb
    opt: paths=source_relative
