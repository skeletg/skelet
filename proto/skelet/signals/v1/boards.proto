syntax = "proto3";

// Boards: a shop's shared dashboards of saved reports. A board keeps each report's definition; the dashboard runs it
// through the Synapse reads the report pages use
package skelet.signals.v1;

import "google/protobuf/timestamp.proto";
import "skelet/signals/v1/synapse.proto";

service BoardService {
  rpc ListBoards(ListBoardsRequest) returns (ListBoardsResponse);
  rpc GetBoard(GetBoardRequest) returns (GetBoardResponse);
  rpc CreateBoard(CreateBoardRequest) returns (CreateBoardResponse);
  // Replaces the name and every report, refused with FAILED_PRECONDITION when the board was saved since read_at
  rpc SaveBoard(SaveBoardRequest) returns (SaveBoardResponse);
  rpc DeleteBoard(DeleteBoardRequest) returns (DeleteBoardResponse);
  // Adds the starter boards to a shop that has none, and leaves one that has any alone
  rpc CreateStarterBoards(CreateStarterBoardsRequest) returns (CreateStarterBoardsResponse);
  // Replaces who the board is shared with - its owner's to change, and only once it's saved
  rpc SetBoardShares(SetBoardSharesRequest) returns (SetBoardSharesResponse);
  // Gives up ownership so everyone on the shop sees the board
  rpc MakeShopBoard(MakeShopBoardRequest) returns (MakeShopBoardResponse);
  // Makes the caller the owner of a board whose owner was removed - core checks the owner is gone before calling
  rpc ClaimBoard(ClaimBoardRequest) returns (ClaimBoardResponse);
  rpc SetBoardFavourite(SetBoardFavouriteRequest) returns (SetBoardFavouriteResponse);
  // Keeps the caller's unsaved edits between visits, until they save or discard them
  rpc SaveBoardDraft(SaveBoardDraftRequest) returns (SaveBoardDraftResponse);
  rpc DiscardBoardDraft(DiscardBoardDraftRequest) returns (DiscardBoardDraftResponse);
}

// One board in the list, without its reports
message BoardSummary {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp updated_at = 3;
  int32 report_count = 4;
  // Empty for a shop board, which everyone on the shop sees
  string owner_admin_id = 5;
  // draft | published
  string status = 6;
  // For the caller: view | edit | own
  string access = 7;
  bool favourite = 8;
  // When the caller's unsaved edits were last kept, unset when there are none
  google.protobuf.Timestamp draft_updated_at = 9;
}

message Board {
  string id = 1;
  string channel_id = 2;
  string name = 3;
  // What a save sends back as read_at
  google.protobuf.Timestamp updated_at = 4;
  repeated BoardReport reports = 5;
  // Empty for a shop board, which everyone on the shop sees
  string owner_admin_id = 6;
  // draft | published - a draft is its owner's alone until its first save
  string status = 7;
  // For the caller: view | edit | own
  string access = 8;
  bool favourite = 9;
  // When the caller's unsaved edits were last kept, unset when there are none
  google.protobuf.Timestamp draft_updated_at = 10;
  // On a single read, for a caller who owns the board
  repeated BoardShare shares = 11;
  // On a single read, the caller's unsaved edits
  BoardDraft draft = 12;
}

// Exactly one of admin_id and role_id is set
message BoardShare {
  string admin_id = 1;
  string role_id = 2;
  // view | edit
  string level = 3;
}

message BoardDraft {
  string payload_json = 1;
  google.protobuf.Timestamp base_updated_at = 2;
  google.protobuf.Timestamp updated_at = 3;
}

message BoardReport {
  string title = 1;
  BoardReportDefinition definition = 2;
  string size = 3; // the tile's width on the board: small | medium (unset) | full
}

// One saved report - which engine and its settings, the arguments that engine's Synapse read takes. A zero value is
// unset; Signals checks the fields its kind needs
message BoardReportDefinition {
  string kind = 1; // insights | funnel | retention | stickiness | flow
  int32 since_days = 2; // 0 = the board's period
  string event = 3; // insights, stickiness, the flow's focus
  string measure = 4; // insights: total | unique
  string unit = 5; // insights and retention: day | week
  string breakdown = 6; // insights, funnel
  repeated string steps = 7; // funnel
  repeated FunnelFilter filters = 8; // funnel
  int32 window_hours = 9; // funnel
  string start_event = 10; // retention
  string return_event = 11; // retention
  int32 periods = 12; // retention
  int32 depth = 13; // flow
  int32 window_days = 14; // stickiness: the return window, 0 = the shop's default
}

message ListBoardsRequest {
  string channel_id = 1;
  // A superuser's every board on the shop, not only what they'd see as themselves
  bool all = 2;
}

message ListBoardsResponse {
  repeated BoardSummary boards = 1;
}

message GetBoardRequest {
  string channel_id = 1;
  string id = 2;
}

message GetBoardResponse {
  Board board = 1;
}

message CreateBoardRequest {
  string channel_id = 1;
  string name = 2;
  repeated BoardReport reports = 3;
}

message CreateBoardResponse {
  Board board = 1;
}

message SaveBoardRequest {
  string channel_id = 1;
  string id = 2;
  string name = 3;
  repeated BoardReport reports = 4;
  google.protobuf.Timestamp read_at = 5;
}

message SaveBoardResponse {
  Board board = 1;
}

message DeleteBoardRequest {
  string channel_id = 1;
  string id = 2;
}

message DeleteBoardResponse {}

message CreateStarterBoardsRequest {
  string channel_id = 1;
}

message CreateStarterBoardsResponse {
  repeated BoardSummary boards = 1;
}

message SetBoardSharesRequest {
  string channel_id = 1;
  string id = 2;
  repeated BoardShare shares = 3;
}

message SetBoardSharesResponse {
  Board board = 1;
}

message MakeShopBoardRequest {
  string channel_id = 1;
  string id = 2;
}

message MakeShopBoardResponse {
  Board board = 1;
}

message ClaimBoardRequest {
  string channel_id = 1;
  string id = 2;
}

message ClaimBoardResponse {
  Board board = 1;
}

message SetBoardFavouriteRequest {
  string channel_id = 1;
  string id = 2;
  bool favourite = 3;
}

message SetBoardFavouriteResponse {}

message SaveBoardDraftRequest {
  string channel_id = 1;
  string id = 2;
  string payload_json = 3;
  // The board's updated_at when the edits began, so a save over a newer one is still refused
  google.protobuf.Timestamp base_updated_at = 4;
}

message SaveBoardDraftResponse {
  google.protobuf.Timestamp updated_at = 1;
}

message DiscardBoardDraftRequest {
  string channel_id = 1;
  string id = 2;
}

message DiscardBoardDraftResponse {}
