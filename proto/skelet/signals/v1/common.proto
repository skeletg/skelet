syntax = "proto3";

// Shapes more than one Signals service returns. Money is always cents plus a currency code, never a
// float, and a window is always a day count rather than a timestamp pair - the server owns "now"
package skelet.signals.v1;

// Money earned in one currency, and how many orders it came from
message AttributedRevenue {
  string currency = 1;
  int64 cents = 2;
  int32 orders = 3;
}

// A label and how often it was seen - devices, referrers, countries and the like
message LabelCount {
  string label = 1;
  int32 views = 2;
}

// A distinct value of some dimension and how often it appeared
message ValueCount {
  string value = 1;
  int32 count = 2;
}

// An event name and how many times it fired
message EventCount {
  string name = 1;
  int32 count = 2;
}
