syntax = "proto3";

// Synapse: customer intelligence over the event spine - behavioural profiles, ad-hoc analysis, and the behavioural segments those produce
// Rows carry customer ids and no names, since this service has no customers table and a label is not worth a second copy of the personal data
package skelet.signals.v1;

import "google/protobuf/timestamp.proto";
import "skelet/signals/v1/common.proto";

service SynapseService {
  rpc GetSynapseOverview(GetSynapseOverviewRequest) returns (GetSynapseOverviewResponse);
  rpc GetFunnel(GetFunnelRequest) returns (GetFunnelResponse);
  rpc GetFlow(GetFlowRequest) returns (GetFlowResponse);
  rpc GetRetention(GetRetentionRequest) returns (GetRetentionResponse);
  rpc GetStickiness(GetStickinessRequest) returns (GetStickinessResponse);
  rpc GetInsights(GetInsightsRequest) returns (GetInsightsResponse);
  rpc GetCustomerProfile(GetCustomerProfileRequest) returns (GetCustomerProfileResponse);
  rpc GetVisitorProfile(GetVisitorProfileRequest) returns (GetVisitorProfileResponse);
  rpc ListCustomerAudiences(ListCustomerAudiencesRequest) returns (ListCustomerAudiencesResponse);
  rpc ListTrackedAttributes(ListTrackedAttributesRequest) returns (ListTrackedAttributesResponse);
  // Channel-wide reach of one tracked attribute's values, most-reached first
  rpc ListAffinityValues(ListAffinityValuesRequest) returns (ListAffinityValuesResponse);
  rpc ListBehavioralSegments(ListBehavioralSegmentsRequest) returns (ListBehavioralSegmentsResponse);
  rpc GetBehavioralSegment(GetBehavioralSegmentRequest) returns (GetBehavioralSegmentResponse);
  // How many customers a definition would match, without saving it
  rpc PreviewBehavioralSegment(PreviewBehavioralSegmentRequest) returns (PreviewBehavioralSegmentResponse);
  rpc SaveBehavioralSegment(SaveBehavioralSegmentRequest) returns (SaveBehavioralSegmentResponse);
  rpc RefreshBehavioralSegment(RefreshBehavioralSegmentRequest) returns (RefreshBehavioralSegmentResponse);
  rpc SetSegmentLifecycleWindows(SetSegmentLifecycleWindowsRequest) returns (SetSegmentLifecycleWindowsResponse);
}

// ---- Definition tree ----

enum SegmentNodeKind {
  SEGMENT_NODE_KIND_UNSPECIFIED = 0;
  SEGMENT_NODE_KIND_GROUP = 1;
  SEGMENT_NODE_KIND_EVENT = 2;
  SEGMENT_NODE_KIND_TRAIT = 3;
  SEGMENT_NODE_KIND_AFFINITY = 4;
}

enum SegmentBoolOp {
  SEGMENT_BOOL_OP_UNSPECIFIED = 0;
  SEGMENT_BOOL_OP_AND = 1;
  SEGMENT_BOOL_OP_OR = 2;
}

// Select customers by their computed traits - lifecycle stage plus RFM score floors
message SegmentTrait {
  repeated string lifecycle = 1;
  int32 min_recency_score = 2;
  int32 min_frequency_score = 3;
  int32 min_monetary_score = 4;
  int32 min_engagement = 5;
}

// Customers who filtered by or viewed products carrying a tracked attribute value in the window
message SegmentAffinity {
  // Attribute slug
  string attr = 1;
  string value = 2;
  // Lookback window, 0 for the server default
  int32 days = 3;
  // Auto-generated by the affinity sync - editing one by hand is overwritten on the next pass
  bool auto = 4;
}

// Did, or with negate did not, perform an event at least count times within the window
message SegmentCondition {
  string event = 1;
  bool negate = 2;
  int32 count = 3;
  int32 days = 4;
}

// One node of a definition tree. A GROUP combines its children with op; a leaf is one of EVENT,
// TRAIT or AFFINITY. Recursive, which protobuf allows directly
message SegmentNode {
  SegmentNodeKind kind = 1;
  // GROUP only
  SegmentBoolOp op = 2;
  repeated SegmentNode children = 3;
  // EVENT leaf, with negate, count and days
  string event = 4;
  bool negate = 5;
  int32 count = 6;
  int32 days = 7;
  SegmentTrait trait = 8;
  SegmentAffinity affinity = 9;
}

// Days since last order. When a segment sets these, its members get them instead of the channel
// default, and the shortest window wins where a customer is in several
message SegmentLifecycleWindows {
  int32 new_days = 1;
  int32 active_days = 2;
  int32 at_risk_days = 3;
}

// A real customer segment whose membership is materialised from a behavioural definition, so it is
// immediately targetable by campaigns and flows
message BehavioralSegment {
  string id = 1;
  string channel_id = 2;
  string name = 3;
  string slug = 4;
  int32 member_count = 5;
  // Always present - derived from the flat criteria when a segment carries no tree of its own
  SegmentNode definition = 6;
  // Flat views of the same definition for compact display; read definition for the truth
  repeated SegmentCondition conditions = 7;
  SegmentTrait trait = 8;
  SegmentAffinity affinity = 9;
  // Absent means inherit the channel default
  optional SegmentLifecycleWindows lifecycle_windows = 10;
}

// ---- Profiles ----

message CustomerActivityItem {
  string event_name = 1;
  google.protobuf.Timestamp occurred_at = 2;
  // web | campaign | flow | transactional | commerce | account
  string source = 3;
  // Best-effort one-line detail - the page, link, custom name or order
  string summary = 4;
  // The event's raw properties, for rich timeline rows
  string details_json = 5;
}

// A page the profile viewed, with view count and average dwell in seconds
message ProfilePageView {
  string title = 1;
  string page_key = 2;
  int32 views = 3;
  int32 dwell_seconds = 4;
}

// A product the profile viewed, with the metadata a visual card needs
message ProfileProductView {
  string name = 1;
  string image = 2;
  // Cents as stored on the page view, blank when unknown
  string price = 3;
  string sku = 4;
  int32 views = 5;
}

// A tracked attribute and this profile's top values for it
message AttributeAffinity {
  string slug = 1;
  string name = 2;
  repeated ValueCount values = 3;
}

// A Prism experiment and the arm this customer landed in, bridged from their anon exposures
message CustomerExperimentArm {
  string experiment = 1;
  string variation = 2;
  google.protobuf.Timestamp last_exposed_at = 3;
}

// Per-customer behavioural traits, shared across the suite. RFM scores are channel-relative
// quintiles 1-5 where 5 is best, and 0 means never ordered
message CustomerTraits {
  // prospect | new | active | at_risk | lapsed
  string lifecycle = 1;
  int32 rfm_recency = 2;
  int32 rfm_frequency = 3;
  int32 rfm_monetary = 4;
  // Days since last order, -1 for never
  int32 recency_days = 5;
  // Lifetime orders
  int32 frequency = 6;
  int64 monetary_cents = 7;
  // 0..100
  int32 engagement_score = 8;
  // Against this customer's own purchase cadence, 0..100
  int32 churn_risk = 9;
  int64 predicted_clv_cents = 10;
  // Days until the next expected order, -1 when unknown because it needs two orders
  int32 next_order_days = 11;
  google.protobuf.Timestamp computed_at = 12;
}

// One person's behavioural profile. The same shape serves a known customer and an anonymous
// visitor - a visitor simply has no traits and no experiment arms
message Profile {
  google.protobuf.Timestamp first_seen = 1;
  google.protobuf.Timestamp last_seen = 2;
  int32 total_events = 3;
  int32 page_views = 4;
  int32 conversions = 5;
  repeated AttributedRevenue revenue = 6;
  repeated EventCount counts = 7;
  repeated CustomerActivityItem timeline = 8;
  // Context the profile was seen with, top values by frequency
  repeated ValueCount devices = 9;
  repeated ValueCount browsers = 10;
  repeated ValueCount referrers = 11;
  repeated ValueCount ip_addresses = 12;
  repeated ValueCount operating_systems = 13;
  repeated ValueCount screens = 14;
  repeated ValueCount countries = 15;
  // utm_source
  repeated ValueCount sources = 16;
  // utm_campaign
  repeated ValueCount campaigns = 17;
  repeated ProfilePageView top_pages = 18;
  // Distinct pages viewed, of which top_pages is the head
  int32 pages_viewed_total = 19;
  repeated ProfileProductView top_products = 20;
  repeated ValueCount searches = 21;
  // Distinct visits, split on a gap of more than 30 minutes
  int32 sessions = 22;
  // Absent for a visitor, and for a customer no trait-compute run has covered yet
  optional CustomerTraits traits = 23;
  repeated CustomerExperimentArm experiments = 24;
  repeated AttributeAffinity affinities = 25;
}

// ---- Overview ----

message SynapseActiveCustomer {
  string customer_id = 1;
  int32 events = 2;
  google.protobuf.Timestamp last_seen = 3;
}

// A visitor not yet identified. last_page is the most recent page seen, so the row reads as more
// than a raw id
message SynapseVisitor {
  string anon_id = 1;
  int32 events = 2;
  google.protobuf.Timestamp last_seen = 3;
  string last_page = 4;
}

message GetSynapseOverviewRequest {
  string channel_id = 1;
  int32 since_days = 2;
}

message GetSynapseOverviewResponse {
  int32 total_events = 1;
  int32 page_views = 2;
  int32 conversions = 3;
  int32 identified_customers = 4;
  // Anon ids not yet identified
  int32 anonymous_visitors = 5;
  repeated AttributedRevenue revenue = 6;
  repeated EventCount top_events = 7;
  repeated SynapseActiveCustomer active_customers = 8;
  repeated SynapseVisitor active_visitors = 9;
}

// ---- Analysis ----

message FunnelStep {
  string event_name = 1;
  int32 count = 2;
}

message GetFunnelRequest {
  string channel_id = 1;
  // In order - how many people reached each one
  repeated string steps = 2;
  int32 since_days = 3;
}

message GetFunnelResponse {
  repeated FunnelStep steps = 1;
}

// One node of the forward path tree from a focus event
message FlowNode {
  // Path key
  string id = 1;
  // Parent path key, the focus event for depth-1 nodes
  string parent_id = 2;
  string event = 3;
  int32 depth = 4;
  int32 count = 5;
}

message FlowPath {
  // The collapsed journey after the focus event
  repeated string events = 1;
  // People who took exactly this path
  int32 count = 2;
}

message GetFlowRequest {
  string channel_id = 1;
  string event = 2;
  int32 since_days = 3;
  int32 depth = 4;
}

message GetFlowResponse {
  string focus = 1;
  // People who did the focus event
  int32 cohort = 2;
  // Of the cohort, how many took at least one tracked next step
  int32 continued = 3;
  // Average journey depth among those who continued
  double avg_steps = 4;
  repeated FlowNode nodes = 5;
  repeated FlowPath top_paths = 6;
}

message RetentionBucket {
  // 0 is the same period as the start event, 1 the next, and so on
  int32 period = 1;
  int32 count = 2;
  // Members mature enough to have reached this period - the denominator
  int32 eligible = 3;
}

message RetentionCohort {
  google.protobuf.Timestamp start_at = 1;
  // People who first did the start event in this bucket
  int32 size = 2;
  repeated RetentionBucket buckets = 3;
}

message GetRetentionRequest {
  string channel_id = 1;
  string start_event = 2;
  string return_event = 3;
  int32 since_days = 4;
  int32 periods = 5;
  // day | week
  string unit = 6;
}

message GetRetentionResponse {
  // Total people across all cohorts
  int32 cohort = 1;
  // The blended curve
  repeated RetentionBucket buckets = 2;
  // Per-start-period rows, the cohort grid
  repeated RetentionCohort cohorts = 3;
}

message ActivePoint {
  // YYYY-MM-DD
  string day = 1;
  int32 count = 2;
}

message GetStickinessRequest {
  string channel_id = 1;
  string event = 2;
  int32 since_days = 3;
  int32 window_days = 4;
}

// Engagement framed around a return window: of the people active in the previous window, how many
// came back in the current one
message GetStickinessResponse {
  // Daily-active trend, for context
  repeated ActivePoint days = 1;
  int32 window_days = 2;
  int32 prior_active = 3;
  int32 active_now = 4;
  int32 returning = 5;
  // returning over prior_active, as a percentage
  double return_rate = 6;
  int32 wau = 7;
  int32 mau = 8;
}

message InsightPoint {
  google.protobuf.Timestamp bucket = 1;
  // The breakdown series this value belongs to
  string key = 2;
  int32 value = 3;
}

message InsightSeries {
  string key = 1;
  int32 total = 2;
}

message GetInsightsRequest {
  string channel_id = 1;
  string event = 2;
  // Event-property key to split into series
  string breakdown = 3;
  // count | unique
  string measure = 4;
  // day | week
  string unit = 5;
  int32 since_days = 6;
}

message GetInsightsResponse {
  repeated InsightPoint points = 1;
  // Distinct series with their window totals, ranked
  repeated InsightSeries series = 2;
  int32 total = 3;
  // Distinct people in the window
  int32 uniques = 4;
  // The prior equal-length window, for deltas
  int32 prev_total = 5;
  int32 prev_uniques = 6;
}

// ---- Profiles, audiences, attributes ----

message GetCustomerProfileRequest {
  string customer_id = 1;
  int32 since_days = 2;
}

message GetCustomerProfileResponse {
  Profile profile = 1;
}

message GetVisitorProfileRequest {
  string channel_id = 1;
  string anon_id = 2;
  int32 since_days = 3;
}

message GetVisitorProfileResponse {
  Profile profile = 1;
}

message ListCustomerAudiencesRequest {
  string customer_id = 1;
}

// An audience the customer belongs to, for their profile page
message SignalSegment {
  string id = 1;
  string name = 2;
  string slug = 3;
}

message ListCustomerAudiencesResponse {
  repeated SignalSegment segments = 1;
}

// A tracked attribute and the values observed for it, so the builder's picker offers real ones
message TrackedAttribute {
  string slug = 1;
  string name = 2;
  // Most-seen values over the last 90 days
  repeated string values = 3;
}

message ListTrackedAttributesRequest {
  string channel_id = 1;
}

message ListTrackedAttributesResponse {
  repeated TrackedAttribute attributes = 1;
}

// One value of a tracked attribute and the distinct customers carrying it - the reach a segment on
// it would have
message AffinityValue {
  string value = 1;
  int32 actors = 2;
}

// A ranked top-N rather than a collection, so it takes a limit and has no page 2
message ListAffinityValuesRequest {
  string channel_id = 1;
  string attribute = 2;
  int32 since_days = 3;
  int32 limit = 4;
}

message ListAffinityValuesResponse {
  repeated AffinityValue values = 1;
}

// ---- Behavioural segments ----

message ListBehavioralSegmentsRequest {
  string channel_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListBehavioralSegmentsResponse {
  repeated BehavioralSegment segments = 1;
  string next_page_token = 2;
}

// Richer than the plain membership row, since the detail page shows a commerce rollup per member
message BehavioralSegmentMember {
  string customer_id = 1;
  // Empty when traits are not computed yet
  string lifecycle = 2;
  // -1 for never ordered
  int32 recency_days = 3;
  int32 orders = 4;
  int64 spend_cents = 5;
  google.protobuf.Timestamp last_order_at = 6;
}

message SegmentGrowthPoint {
  // YYYY-MM-DD
  string day = 1;
  int32 count = 2;
}

message SegmentStageCount {
  // Lifecycle stage, empty when traits are not computed yet
  string stage = 1;
  int32 count = 2;
}

message SegmentRfmBucket {
  // recency | frequency | monetary
  string dimension = 1;
  // 0-5
  int32 score = 2;
  int32 count = 3;
}

message SegmentAffinityCount {
  string attr = 1;
  string value = 2;
  int32 members = 3;
}

message GetBehavioralSegmentRequest {
  string id = 1;
}

// The segment plus a commerce rollup over its members, a capped member list and the growth series
// Money is in the channel's own currency - members' cross-currency orders sum naively, which is exact for the single-currency channels that are the norm
message GetBehavioralSegmentResponse {
  BehavioralSegment segment = 1;
  // ISO 4217
  string currency = 2;
  // Total non-cancelled order revenue of members
  int64 revenue_cents = 3;
  int32 orders = 4;
  int64 aov_cents = 5;
  // Top spenders, capped
  repeated BehavioralSegmentMember members = 6;
  bool members_truncated = 7;
  repeated SegmentGrowthPoint growth = 8;
  repeated SegmentStageCount lifecycle_mix = 9;
  repeated SegmentRfmBucket rfm_distribution = 10;
  repeated SegmentAffinityCount top_affinities = 11;
}

// A definition as the builder submits it - a tree, or the flat criteria a simpler editor produces
message SegmentDefinition {
  SegmentNode root = 1;
  repeated SegmentCondition conditions = 2;
  SegmentTrait trait = 3;
  SegmentAffinity affinity = 4;
}

message PreviewBehavioralSegmentRequest {
  string channel_id = 1;
  SegmentDefinition definition = 2;
}

message PreviewBehavioralSegmentResponse {
  int32 matched = 1;
}

// Creates when segment_id is empty, updates when it is not - the update path only accepts a
// behavioural segment already belonging to this channel
message SaveBehavioralSegmentRequest {
  string channel_id = 1;
  string name = 2;
  string segment_id = 3;
  SegmentDefinition definition = 4;
}

message SaveBehavioralSegmentResponse {
  BehavioralSegment segment = 1;
}

message RefreshBehavioralSegmentRequest {
  string segment_id = 1;
}

message RefreshBehavioralSegmentResponse {
  BehavioralSegment segment = 1;
}

// Absent windows clear the override and return the segment to the channel default. Set ones must be
// ascending and positive
message SetSegmentLifecycleWindowsRequest {
  string segment_id = 1;
  optional SegmentLifecycleWindows windows = 2;
}

message SetSegmentLifecycleWindowsResponse {
  BehavioralSegment segment = 1;
}
