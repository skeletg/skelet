# The core-to-Signals wire contract. Signals is never called by anything but core, so this is an internal contract rather than a published one - but it crosses a process boundary and will cross a module boundary, so it is versioned and gated like one
version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
  # shortcut: the retired event destinations are deleted outright (core and the suite ship together), drop these once a release has them
  ignore_only:
    FILE_NO_DELETE:
      - skelet/signals/v1/destinations.proto
    MESSAGE_NO_DELETE:
      - skelet/signals/v1/maintenance.proto
    RPC_NO_DELETE:
      - skelet/signals/v1/maintenance.proto
    FIELD_NO_DELETE:
      - skelet/signals/v1/maintenance.proto
