# Follows an offer link - the storefront then keeps the token and sends it as X-Cart-Offer
mutation OpenCartOffer($token: String!) {
  openCartOffer(token: $token) {
    cartId
    state
    requiresLogin
  }
}

# The offers the signed-in customer may open from their account
query MyCartOffers {
  myCartOffers {
    ...CartFull
  }
}

# The recipient's first look at an offer - sent from the browser, so a mail scanner fetching the link doesn't count
mutation MarkCartOfferOpened($cartId: ID!) {
  markCartOfferOpened(cartId: $cartId)
}
