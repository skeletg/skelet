# Small profile - the minimum deployable Skelet tenant
#
# One app container runs every backend role (API, WS, /media/t/*, scheduler,
# webhook delivery, outbox relay, Signals retention/forwarding/trait-compute)
# One Postgres holds both schemas as two databases - no Valkey, no NATS, no
# ClickHouse, no OpenSearch, no Vector, no split-out tiers
#
# Same images as docker-compose.prod.yml - the difference is env, not a build
# Scaling up is this file's env changing: set VALKEY_URL for multi-replica, then
# JOBS_EXTERNAL / SIGNALS_JOBS_EXTERNAL to split the tiers back out
#
#   cp env/small.env.example env/small.env
#   cp env/small-vetrina-demo.env.example env/small-vetrina-demo.env
#   cp .env.example .env   # JWT_SECRET, CONFIG_ENCRYPTION_KEY, DB_PASSWORD
#   docker compose -f docker-compose.small.yml up -d
#
# Add --profile edge for TLS and automatic certs via deploy/caddy/Caddyfile (needs
# env/prod-caddy.env too) - without it nothing terminates https and cards can't be taken
#
# Ports are offset (18080/18081/13000/15432) so this runs beside the dev stack
#
# The single-node degrade paths this leans on are deliberate - see
# wiring/graphql.go (per-process rate limiting) and notification/hub.go (local
# WS fanout) - both are correct for exactly one replica and no more
name: skelet-small

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Same split as prod: secrets in the root .env (the only file compose
# interpolates), everything else in env/small.env - see .env.example and docs/env.md
x-secrets: &secrets
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the root .env (openssl rand -hex 32)}
  CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?set CONFIG_ENCRYPTION_KEY in the root .env (openssl rand -base64 32)}
  STOREFRONT_REVALIDATE_SECRET: ${STOREFRONT_REVALIDATE_SECRET:-}

# Both DSNs derive from the one password the db container below uses, so they
# can't drift - set either URL outright to point at a managed Postgres instead
x-db-urls: &db-urls
  DATABASE_URL: ${DATABASE_URL-postgres://skelet:${DB_PASSWORD:?set DB_PASSWORD in the root .env}@db:5432/skelet?sslmode=disable}
  SIGNALS_DB_URL: ${SIGNALS_DB_URL-postgres://skelet:${DB_PASSWORD:?set DB_PASSWORD in the root .env}@db:5432/skelet_signals?sslmode=disable}

services:
  app:
    image: ${APP_IMAGE:-skelet-app:prod}
    env_file: [env/small.env]
    environment:
      <<: [*secrets, *db-urls]
    ports: ["127.0.0.1:18080:8080"]
    # Object storage is the one dependency that isn't in this file - the app hard-
    # fails without a bucket - reaches the dev Garage on the host for the measurement
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      signals-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    # Same drain budget as prod - this process owns the background layer too
    stop_grace_period: 40s
    logging: *logging

  # Both one-shots run against the same cluster, different databases
  migrate:
    image: ${APP_IMAGE:-skelet-app:prod}
    env_file: [env/small.env]
    environment: *db-urls
    depends_on:
      db: { condition: service_healthy }
    command: ["sh", "-c", "migrate -path /app/migrations -database \"$$DATABASE_URL\" up && skelet data-patch up"]
    restart: "no"
    logging: *logging

  signals-migrate:
    image: ${APP_IMAGE:-skelet-app:prod}
    env_file: [env/small.env]
    environment: *db-urls
    depends_on:
      db: { condition: service_healthy }
    command: ["sh", "-c", "migrate -path /app/signals-migrations -database \"$$SIGNALS_DB_URL\" up"]
    restart: "no"
    logging: *logging

  # Tenant-agnostic image - the SPA calls the relative /api and nginx envsubsts
  # BACKEND_UPSTREAM at start, so this is the same build for every tenant
  dashboard:
    image: ${DASHBOARD_IMAGE:-skelet-dashboard:prod}
    ports: ["127.0.0.1:18081:8080"]
    environment:
      BACKEND_UPSTREAM: http://app:8080
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  vetrina-demo:
    image: ${VETRINA_DEMO_IMAGE:-skelet-vetrina-demo:prod}
    env_file: [env/small-vetrina-demo.env]
    ports: ["127.0.0.1:13000:3000"]
    environment:
      BACKEND_INTERNAL_URL: http://app:8080
      # The two it shares with the backend, from the same root .env - it gets
      # neither the encryption key nor a DB password
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the root .env (openssl rand -hex 32)}
      STOREFRONT_REVALIDATE_SECRET: ${STOREFRONT_REVALIDATE_SECRET:-}
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging: *logging

  # One cluster, two databases - init-signals-db.sql adds the Signals one beside
  # the POSTGRES_DB commerce one, on first init only
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: skelet
      # An existing db-data volume keeps the password it was initialized with -
      # changing this later needs an ALTER USER, not just a restart
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in the root .env}
      POSTGRES_DB: skelet
    volumes:
      - db-data:/var/lib/postgresql
      - ./deploy/postgres/init-signals-db.sql:/docker-entrypoint-initdb.d/10-signals.sql:ro
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  # Opt-in TLS edge - `--profile edge` - this is the profile that needs it most: one
  # box, no proxy in front, and card payments can't happen over plain http
  #
  # Shares deploy/caddy/Caddyfile and env/prod-caddy.env with the prod stack - same three
  # vhosts, same upstream ports, so moving up is env changing rather than a rewrite
  caddy:
    profiles: ["edge"]
    image: caddy:2-alpine
    env_file: [env/prod-caddy.env]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app: { condition: service_healthy }
      dashboard: { condition: service_healthy }
      vetrina-demo: { condition: service_healthy, required: false }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *logging

volumes:
  db-data:
  caddy-data:
  caddy-config:
