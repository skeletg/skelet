# Small profile - the minimum deployable tenant: one app container runs every backend role, one Postgres holds both schemas, and the ports are offset to run beside the dev stack
# Same images as the prod stack, so scaling up is this file's env changing - see docs/deploying.md for the env files to copy and for --profile edge
name: skelet-small

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Same split as prod: secrets in the root .env (the only file compose
# interpolates), everything else in env/small.env - see .env.example and docs/env.md
x-secrets: &secrets
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the root .env (openssl rand -hex 32)}
  # Core and the suite share this one alone - the storefront below gets JWT_SECRET, never this
  SIGNALS_SERVICE_SECRET: ${SIGNALS_SERVICE_SECRET:?set SIGNALS_SERVICE_SECRET in the root .env (openssl rand -hex 32, distinct from JWT_SECRET)}
  CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?set CONFIG_ENCRYPTION_KEY in the root .env (openssl rand -base64 32)}
  STOREFRONT_REVALIDATE_SECRET: ${STOREFRONT_REVALIDATE_SECRET:-}

# Both DSNs derive from the one password the db container below uses, so they
# can't drift - set either URL outright to point at a managed Postgres instead
x-db-urls: &db-urls
  DATABASE_URL: ${DATABASE_URL-postgres://skelet:${DB_PASSWORD:?set DB_PASSWORD in the root .env}@db:5432/skelet?sslmode=disable}
  SIGNALS_DB_URL: ${SIGNALS_DB_URL-postgres://skelet:${DB_PASSWORD:?set DB_PASSWORD in the root .env}@db:5432/skelet_signals?sslmode=disable}
  # The spine, only with --profile signals - one password for the box, so ClickHouse reuses DB_PASSWORD unless told otherwise
  SIGNALS_CH_URL: ${SIGNALS_CH_URL-clickhouse://skelet:${CLICKHOUSE_PASSWORD:-${DB_PASSWORD}}@clickhouse:9000/signals}
  SIGNALS_CH_MIGRATE_URL: ${SIGNALS_CH_MIGRATE_URL-clickhouse://clickhouse:9000?username=skelet&password=${CLICKHOUSE_PASSWORD:-${DB_PASSWORD}}&database=signals&x-multi-statement=true}

services:
  app:
    image: ${APP_IMAGE:-skelet-app:prod}
    env_file: [env/small.env]
    environment:
      <<: [*secrets, *db-urls]
    ports: ["127.0.0.1:18080:8080"]
    # Object storage is the one dependency that isn't in this file - the app hard-
    # fails without a bucket - reaches the dev Garage on the host for the measurement
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    # Same drain budget as prod - this process owns the background layer too
    stop_grace_period: 40s
    logging: *logging

  # Both one-shots run against the same cluster, different databases
  migrate:
    image: ${APP_IMAGE:-skelet-app:prod}
    env_file: [env/small.env]
    environment: *db-urls
    depends_on:
      db: { condition: service_healthy }
    command: ["sh", "-c", "migrate -path /app/migrations -database \"$$DATABASE_URL\" up && skelet data-patch up"]
    restart: "no"
    logging: *logging

  # ---- The Signals suite, behind --profile signals - set SIGNALS_ENABLED=true in env/small.env with it ----
  signals-migrate:
    profiles: ["signals"]
    image: ${SIGNALS_IMAGE:-skelet-signals:prod}
    env_file: [env/small.env]
    environment: *db-urls
    depends_on:
      db: { condition: service_healthy }
    command: ["sh", "-c", "migrate -path /app/signals-migrations -database \"$$SIGNALS_DB_URL\" up"]
    restart: "no"
    logging: *logging
  clickhouse:
    profiles: ["signals"]
    image: clickhouse/clickhouse-server:26.7.5
    environment:
      CLICKHOUSE_DB: signals
      CLICKHOUSE_USER: skelet
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-${DB_PASSWORD}}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user=\"$$CLICKHOUSE_USER\" --password=\"$$CLICKHOUSE_PASSWORD\" --query='SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    logging: *logging
  clickhouse-migrate:
    profiles: ["signals"]
    image: ${SIGNALS_IMAGE:-skelet-signals:prod}
    env_file: [env/small.env]
    environment: *db-urls
    depends_on:
      clickhouse: { condition: service_healthy }
    command: ["sh", "-c", "migrate -path /app/clickhouse-migrations -database \"$$SIGNALS_CH_MIGRATE_URL\" up"]
    restart: "no"
    logging: *logging
  signals:
    profiles: ["signals"]
    image: ${SIGNALS_IMAGE:-skelet-signals:prod}
    env_file: [env/small.env]
    environment:
      <<: [*secrets, *db-urls]
    command: ["/app/signals"]
    depends_on:
      db: { condition: service_healthy }
      signals-migrate: { condition: service_completed_successfully }
      clickhouse: { condition: service_healthy }
      clickhouse-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 40s
    logging: *logging

  # Tenant-agnostic image - the SPA calls the relative /api and nginx envsubsts
  # BACKEND_UPSTREAM at start, so this is the same build for every tenant
  dashboard:
    image: ${DASHBOARD_IMAGE:-skelet-dashboard:prod}
    ports: ["127.0.0.1:18081:8080"]
    environment:
      BACKEND_UPSTREAM: http://app:8080
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  vetrina-demo:
    image: ${VETRINA_DEMO_IMAGE:-skelet-vetrina-demo:prod}
    env_file: [env/small-vetrina-demo.env]
    ports: ["127.0.0.1:13000:3000"]
    environment:
      BACKEND_INTERNAL_URL: http://app:8080
      # The two it shares with the backend, from the same root .env - it gets
      # neither the encryption key nor a DB password
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the root .env (openssl rand -hex 32)}
      STOREFRONT_REVALIDATE_SECRET: ${STOREFRONT_REVALIDATE_SECRET:-}
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging: *logging

  # One cluster, two databases - init-signals-db.sql adds the Signals one beside
  # the POSTGRES_DB commerce one, on first init only
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: skelet
      # An existing db-data volume keeps the password it was initialized with -
      # changing this later needs an ALTER USER, not just a restart
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in the root .env}
      POSTGRES_DB: skelet
    volumes:
      - db-data:/var/lib/postgresql
      - ./deploy/postgres/init-signals-db.sql:/docker-entrypoint-initdb.d/10-signals.sql:ro
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  # Opt-in TLS edge - `--profile edge` - this is the profile that needs it most: one box, no proxy in front, and card payments can't happen over plain http
  caddy:
    profiles: ["edge"]
    image: caddy:2-alpine
    env_file: [env/prod-caddy.env]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app: { condition: service_healthy }
      dashboard: { condition: service_healthy }
      vetrina-demo: { condition: service_healthy, required: false }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *logging

volumes:
  db-data:
  clickhouse-data:
  caddy-data:
  caddy-config:
