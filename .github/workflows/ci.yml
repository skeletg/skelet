# Backend + frontend test gate - the service containers are here so the env-gated integration suites run on every push, not only when someone exports the DSNs
# Mirrors dev on postgres 18, clickhouse 26.7.5 and migrate v4.19.1, held together by bin/pin-check - the queue round-trip embeds nats-server and needs no service
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend build + tests (unit & gated integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: skelet
          POSTGRES_PASSWORD: skelet
          POSTGRES_DB: skelet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skelet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:26.7.5
        env:
          CLICKHOUSE_DB: skelet_test_signals
          CLICKHOUSE_USER: skelet
          CLICKHOUSE_PASSWORD: skelet
        ports: ["9000:9000"]
        options: >-
          --health-cmd "clickhouse-client --user=skelet --password=skelet --query='SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://skelet:skelet@localhost:5432/skelet?sslmode=disable
      SIGNALS_DB_URL: postgres://skelet:skelet@localhost:5432/skelet_signals?sslmode=disable
      SIGNALS_CH_TEST_DSN: clickhouse://skelet:skelet@localhost:9000/skelet_test_signals
    steps:
      # Full history + tags: the SDK's apidiff gate compares the surface against the last v* tag,
      # and a depth-1 checkout has none, which silently downgrades it to a skip
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/core/go.mod
          cache-dependency-path: |
            apps/backend/core/go.sum
            apps/backend/signals/go.sum
            apps/backend/sdk/go.sum
      - name: Install dbmate
        run: |
          CGO_ENABLED=0 go install github.com/amacneil/dbmate/v2@v2.36.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # The signals schema lives in its own database, same instance is fine (the
      # split contract) - the service container only creates the commerce one
      - name: Create signals database
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE skelet_signals'
        env:
          PGPASSWORD: skelet
      # Every DB-backed test refuses a database without this marker (testdb) - tests
      # write real rows, so consent lives in the database, where a production DSN can't carry it
      - name: Mark databases as test-disposable
        run: |
          psql "$DATABASE_URL" -c "ALTER DATABASE skelet SET skelet.e2e = 'allowed'"
          psql "$DATABASE_URL" -c "ALTER DATABASE skelet_signals SET skelet.e2e = 'allowed'"
        env:
          PGPASSWORD: skelet
      - name: Mark the spine database as test-disposable
        run: docker exec ${{ job.services.clickhouse.id }} clickhouse-client --user=skelet --password=skelet --query "ALTER DATABASE skelet_test_signals MODIFY COMMENT 'skelet.e2e=allowed'"
      - name: Migrate commerce
        working-directory: apps/backend/core
        run: dbmate --no-dump-schema --migrations-dir internal/db/migrations up
      - name: Migrate signals
        working-directory: apps/backend/signals
        run: dbmate --no-dump-schema --env SIGNALS_DB_URL --migrations-dir internal/db/migrations up
      - name: Migrate clickhouse
        working-directory: apps/backend/signals
        run: dbmate --no-dump-schema --env SIGNALS_CH_TEST_DSN --migrations-dir internal/analytics/spinech/migrations up
      - name: Build
        working-directory: apps/backend/core
        run: go build ./...
      - name: Vet
        working-directory: apps/backend/core
        run: go vet ./...
      - name: Test
        working-directory: apps/backend/core
        # -race, because the bus dispatches to detached goroutines and the outbox relay runs eight concurrent workers
        # -timeout past go's 10m default - CI builds its databases fresh, but -race is a different animal
        # internal/e2e sits out, as in bin/test - bin/test-e2e gives it its own databases and a Signals process
        run: go test $(go list ./... | grep -v '/internal/e2e$') -count=1 -race -timeout 60m
      # The Signals module is its own go.mod, replacing core's by relative path - a change in a core
      # package the suite imports has to fail here, not on the suite's image build
      - name: Build (signals)
        working-directory: apps/backend/signals
        run: go build ./...
      - name: Vet (signals)
        working-directory: apps/backend/signals
        run: go vet ./...
      - name: Test (signals)
        working-directory: apps/backend/signals
        run: go test $(go list ./... | grep -v '/internal/e2e$') -count=1 -race -timeout 60m
      # The SDK is the third module - its surface gate compares against the last tag, which the full-depth checkout above provides
      - name: Test (sdk)
        working-directory: apps/backend/sdk
        run: go test ./... -count=1 -race
      # The containers build with -tags vips (libvips webp rendering) - this step
      # is the only CI coverage that file gets, since the untagged runs skip it
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev
      - name: Build + test (vips tag)
        working-directory: apps/backend/core
        # -race here too - the tag already forces cgo, so the toolchain cost is paid
        run: |
          go build -tags vips ./...
          go test -tags vips ./internal/media/... ./internal/mediahttp/... -count=1 -race

  # The app set is a directory listing, not a constant - a fork that swaps the demo
  # storefront for its own gets the same gates without editing the matrices below
  discover:
    name: Discover apps
    runs-on: ubuntu-latest
    outputs:
      frontends: ${{ steps.list.outputs.frontends }}
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          front='{"app":"dashboard","dir":"apps/dashboard"}'
          # Both Go images build from apps/backend as a whole, since the modules replace each other by relative path
          images='{"image":"backend","context":"apps/backend","file":"apps/backend/core/Dockerfile.prod"},{"image":"signals","context":"apps/backend","file":"apps/backend/signals/Dockerfile.prod"},{"image":"dashboard","context":"apps/dashboard"}'
          for d in apps/channels/*/; do
            [ -f "$d/package.json" ] || continue
            n=$(basename "$d")
            front="$front,{\"app\":\"$n\",\"dir\":\"apps/channels/$n\"}"
            images="$images,{\"image\":\"$n\",\"context\":\"apps/channels/$n\"}"
          done
          echo "frontends={\"include\":[$front]}" >> "$GITHUB_OUTPUT"
          echo "images={\"include\":[$images]}" >> "$GITHUB_OUTPUT"
          echo "frontends: [$front]"
          echo "images: [$images]"

  frontend:
    name: ${{ matrix.app }} typecheck + tests
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.frontends) }}
    steps:
      - uses: actions/checkout@v4
      # Version from the app's packageManager field - there's no root package.json for the
      # action's default to read. Before setup-node, whose pnpm cache needs pnpm on PATH
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ matrix.dir }}/package.json
      # .nvmrc is the pin - bin/pin-check keeps it in step with the app Dockerfiles,
      # which stay literal because a Dockerfile has to build on its own
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: ${{ matrix.dir }}/pnpm-lock.yaml
      - name: Install
        working-directory: ${{ matrix.dir }}
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: ${{ matrix.dir }}
        run: pnpm run typecheck
      # eslint stays out - it has accepted findings and bin/lint treats it as non-blocking
      - name: Test
        working-directory: ${{ matrix.dir }}
        run: pnpm test
      # Production build - catches what typecheck+tests can't (vite chunking, next's prerender pass). Needs no live backend: every
      # storefront route is dynamic (gqlFetch reads cookies/headers), so next build fetches nothing at build time
      - name: Build
        working-directory: ${{ matrix.dir }}
        run: pnpm run build

  # The prod images are how this actually deploys, so a Dockerfile that stops building must fail the PR, not the release evening.
  # Build only - no push, no tags The dashboard's workspace shell is pointer gestures and cross-device state - dragging tabs between panes, splits, workspaces roaming through the preferences store.
  e2e:
    name: Dashboard end-to-end (real browser, real stack)
    runs-on: ubuntu-latest
    env:
      E2E_ADMIN_EMAIL: e2e@skelet.test
      E2E_ADMIN_PASSWORD: e2e-password
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/dashboard/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml
      # bin/setup writes these from the templates on a dev machine; CI has no interactive setup. The templates
      # leave the customer session pair and the config key blank, and the server refuses to boot without
      # them, so they're generated here the way bin/setup does it - the public half derived from the seed
      - name: Environment files
        run: |
          cp env/go.env.example env/go.env
          cp env/db.env.example env/db.env
          seed="$(openssl rand -base64 32 | tr -d '\n')"
          pub="$({ printf '\x30\x2e\x02\x01\x00\x30\x05\x06\x03\x2b\x65\x70\x04\x22\x04\x20'; printf '%s' "$seed" | base64 -d; } \
            | openssl pkey -inform DER -pubout -outform DER | tail -c 32 | base64 | tr -d '\n')"
          sed -i -e "s|^CUSTOMER_JWT_PRIVATE_KEY=.*|CUSTOMER_JWT_PRIVATE_KEY=$seed|" \
            -e "s|^CUSTOMER_JWT_PUBLIC_KEY=.*|CUSTOMER_JWT_PUBLIC_KEY=$pub|" \
            -e "s|^CONFIG_ENCRYPTION_KEY=.*|CONFIG_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')|" env/go.env
      # The dev containers run as SKELET_UID, which only bin/_lib exports - left at compose's 1000, Air can't write to the runner's checkout
      - name: Container user
        run: |
          echo "SKELET_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "SKELET_GID=$(id -g)" >> "$GITHUB_ENV"
      # Before the stack - the dashboard container's node_modules volume would otherwise leave a root-owned mount point here that pnpm can't write
      - name: Install
        working-directory: apps/dashboard
        run: pnpm install --frozen-lockfile
      - name: Install the browser
        working-directory: apps/dashboard
        run: pnpm exec playwright install --with-deps chromium
      # --wait blocks on the app's healthcheck, and the app migrates before it serves, so healthy means migrated
      - name: Start the stack
        run: docker compose --profile dashboard up -d --wait app dashboard
      # The dev admin on a workstation is created by hand, so CI mints its own - the flags exist
      # because the prompts need a TTY
      - name: Seed the e2e admin
        run: |
          docker compose exec -T app go run ./cmd/cli admin create-superuser \
            --email "$E2E_ADMIN_EMAIL" --password "$E2E_ADMIN_PASSWORD" \
            --first-name E2E --last-name Runner
      # Vite is up before it is ready to serve, and --wait only knows the container is running
      - name: Wait for the dashboard
        run: timeout 180 bash -c 'until curl -sf -o /dev/null http://localhost:5173/login; do sleep 2; done'
      - name: Run the suite
        working-directory: apps/dashboard
        run: pnpm run test:e2e
      # A failed browser test says little without the trace, and nothing at all about why the
      # stack behind it misbehaved
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/dashboard/playwright-report/
            apps/dashboard/test-results/
          retention-days: 7
      - name: Stack logs
        if: failure()
        run: docker compose --profile dashboard logs --tail 200

  docker:
    name: Docker image (${{ matrix.image }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      # buildx for the RUN --mount=type=cache lines and the gha cache backend
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file || format('{0}/Dockerfile.prod', matrix.context) }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  lint:
    name: Backend lint (gofmt + golangci)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/core/go.mod
          cache-dependency-path: |
            apps/backend/core/go.sum
            apps/backend/signals/go.sum
            apps/backend/sdk/go.sum
      - name: gofmt
        run: |
          for mod in apps/backend/core apps/backend/signals apps/backend/sdk; do
            unformatted=$(cd "$mod" && gofmt -l .)
            if [ -n "$unformatted" ]; then
              echo "gofmt would reformat in $mod:" && echo "$unformatted" && exit 1
            fi
          done
      # same pin as bin/lint - the two must agree or CI and local disagree
      - name: golangci-lint
        run: |
          for mod in apps/backend/core apps/backend/signals apps/backend/sdk; do
            echo "==> $mod"
            (cd "$mod" && go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...) || exit 1
          done
      # The pre-commit hook runs the whole of bin/codegen, but two of its steps need a live backend, so CI covers the part that needs
      # nothing but Go - it also fails when a plugin directory exists that plugins.json has not decided on
      - name: Plugin set matches plugins.json
        working-directory: apps/backend/core
        run: |
          go run ./cmd/plugingen
          git diff --exit-code plugins/firstparty

  # The same command the pre-commit hook runs, so "bin/check passes" means the same
  # thing locally and here. Greps, plus buf's compatibility check of the proto against main, which
  # needs main's history and runs on the host Go here (in the app container on a workstation)
  gates:
    name: bin/check (pins, structure, contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/core/go.mod
          cache-dependency-path: apps/backend/core/go.sum
      - run: bin/check

  # The backend half of bin/codegen --check (the TS half needs a running server) - regenerates in place and fails on any diff
  codegen:
    name: Codegen drift (backend half)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/core/go.mod
          cache-dependency-path: |
            apps/backend/core/go.sum
            apps/backend/signals/go.sum
            apps/backend/sdk/go.sum
      - name: Environment files
        run: |
          cp env/go.env.example env/go.env
          cp env/db.env.example env/db.env
      - name: bin/codegen --check --no-frontend
        run: bin/codegen --check --no-frontend
