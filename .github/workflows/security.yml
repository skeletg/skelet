# Security scanning gate. Complements renovate (which only bumps versions) by
# failing CI on a known-vulnerable dependency or a committed secret before it merges
name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # The whole history, not just the diff - a secret is public the moment it's pushed, whichever commit holds it.
  # Reviewed fixtures are in .gitleaksignore. The binary, not gitleaks-action, which wants a licence for an org
  gitleaks:
    name: Secrets in history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v$VERSION"
          curl -sSfL -o gitleaks.tgz "$base/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL "$base/gitleaks_${VERSION}_checksums.txt" | grep 'linux_x64.tar.gz$' | awk '{print $1"  gitleaks.tgz"}' | sha256sum -c
          tar xzf gitleaks.tgz gitleaks
      - name: Scan
        run: ./gitleaks git --no-banner --redact --exit-code 1 .

  govulncheck:
    name: Go vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/core/go.mod
          cache-dependency-path: |
            apps/backend/core/go.sum
            apps/backend/signals/go.sum
            apps/backend/sdk/go.sum
      # Pinned, not @latest - a scanner release can't silently change what merges
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      # Every Go module - the Signals one pulls in only part of core's dependency graph, so its own
      # scan is what says whether the suite's image is affected. The CLI's is the standard library alone
      - name: Scan
        run: |
          for mod in apps/backend/core apps/backend/signals apps/backend/sdk cmd/skelet; do
            echo "==> $mod"
            (cd "$mod" && govulncheck ./...) || exit 1
          done

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Any app's packageManager will do - skelet check pins holds them all to one version
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/dashboard/package.json
      # .nvmrc is the pin - skelet check pins keeps it in step with the app Dockerfiles,
      # which stay literal because a Dockerfile has to build on its own
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # A loop, not a matrix - an audit takes seconds, so the app list can come from
      # the directory listing rather than a constant a forked storefront has to edit
      - name: Audit (fails on high/critical only, moderate and low just report)
        run: |
          fail=0
          for dir in apps/dashboard apps/channels/*/; do
            [ -f "$dir/package.json" ] || continue
            echo "==> $dir"
            (cd "$dir" && pnpm audit --audit-level high) || fail=1
          done
          exit $fail
