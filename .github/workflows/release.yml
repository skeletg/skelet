# A pushed release tag publishes its GitHub release: the changelog as the notes, and the skelet CLI for macOS and
# Linux beside install.sh, which is what the README's one-line install fetches from the latest release. Then the
# storefront packages and the compiled dashboard go to npm at the same version
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  cli:
    name: Publish the release and the CLI
    if: github.repository == 'skeletg/skelet' # a project made from Skelet carries this file, and its own tags publish nothing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cmd/skelet/go.mod
          cache: false
      # ci.yml gates pull requests into main, and a tag can be pushed from anywhere - the binaries ship only if their
      # own tests pass on the commit they're built from
      - name: Vet + test
        working-directory: cmd/skelet
        run: |
          go vet ./...
          go test ./... -count=1 -race
      - name: Build
        working-directory: cmd/skelet
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p ../../dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*} arch=${target#*/}
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$TAG" \
              -o "../../dist/skelet-$os-$arch" .
          done
          cp install.sh ../../dist/
          cd ../../dist && sha256sum skelet-* install.sh > checksums.txt
      # gh attestation verify skelet-linux-amd64 --repo skeletg/skelet proves a binary came from this workflow, which
      # checksums.txt alone can't - it's served from the same place as the files it vouches for
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      # Creates the release when the tag is new, or adds the files to one made by hand first
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi
          notes=(--generate-notes)
          [ -f "changelog/${TAG#v}.md" ] && notes=(--notes-file "changelog/${TAG#v}.md")
          pre=()
          case "$TAG" in *-*) pre=(--prerelease) ;; esac
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" "${notes[@]}" "${pre[@]}"

  # The storefront packages at the tag's version, after the release they belong to. npm trusts this workflow by name
  # (trusted publishing, set on each package at npmjs.com), so no token is stored anywhere
  npm:
    name: Publish the storefront packages to npm
    if: github.repository == 'skeletg/skelet'
    needs: cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: packages/storefront-core/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck + test
        run: |
          pnpm -r --filter './packages/*' --if-present run typecheck
          pnpm -r --filter './packages/*' --if-present run test
      - name: Pack + check
        env:
          TAG: ${{ github.ref_name }}
        run: node packages/publish.mjs pack "${TAG#v}" npm-dist
      # npm never takes a version twice, so a rerun skips what's already up; a prerelease stays off the latest tag
      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          channel=()
          case "$version" in *-*) channel=(--tag next) ;; esac
          for name in storefront-core storefront-react storefront-next storefront-astro; do
            if npm view "@skelet/$name@$version" version >/dev/null 2>&1; then
              echo "@skelet/$name@$version is already on npm"
              continue
            fi
            npm publish "./npm-dist/skelet-$name-$version.tgz" --access public "${channel[@]}"
          done

  # The dashboard at the tag's version, compiled - what a project builds with its plugins, and what a plugin's dashboard
  # package imports from. Built here with no credential in reach: installing and compiling runs every build dependency's
  # code, and the job that can publish runs none of it
  dashboard-build:
    name: Build the dashboard package
    if: github.repository == 'skeletg/skelet'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/dashboard/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: node package/build.mjs "${TAG#v}"
      - name: Build a project on it
        run: node package/smoke.mjs "$RUNNER_TEMP/smoke"
      - name: Pack
        run: npm pack ./package/out --pack-destination "$RUNNER_TEMP/dashboard"
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-package
          path: ${{ runner.temp }}/dashboard/*.tgz
          if-no-files-found: error

  # Trusted publishing again, set on the package at npmjs.com once its first version is up
  dashboard:
    name: Publish the dashboard to npm
    if: github.repository == 'skeletg/skelet'
    needs: [cli, dashboard-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-package
      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          if npm view "@skelet/dashboard@$version" version >/dev/null 2>&1; then
            echo "@skelet/dashboard@$version is already on npm"
            exit 0
          fi
          channel=()
          case "$version" in *-*) channel=(--tag next) ;; esac
          npm publish "./skelet-dashboard-$version.tgz" --access public "${channel[@]}"
