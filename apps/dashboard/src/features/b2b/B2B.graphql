query Companies {
  companies {
    id
    channelId
    name
    status
    creditLimitCents
    creditUsedCents
    paymentTermsDays
    defaultCustomerGroupSlug
    createdAt
  }
}

query CompanyDetail($id: ID!) {
  company(id: $id) {
    id
    name
    status
    creditLimitCents
    creditUsedCents
    paymentTermsDays
    defaultCustomerGroupSlug
    prices {
      id
      productId
      productSku
      priceCents
    }
  }
  companyMembers(companyId: $id) {
    customerId
    role
    email
    firstName
    lastName
    orderLimitCents
  }
  companyCreditEntries(companyId: $id) {
    id
    orderId
    amountCents
    reason
    createdAt
  }
}

mutation CreateCompany($channelId: ID!, $name: String!, $creditLimitCents: Int!, $paymentTermsDays: Int!) {
  createCompany(channelId: $channelId, name: $name, creditLimitCents: $creditLimitCents, paymentTermsDays: $paymentTermsDays) {
    id
  }
}

mutation UpdateCompany($id: ID!, $name: String!, $status: String!, $creditLimitCents: Int!, $paymentTermsDays: Int!) {
  updateCompany(id: $id, name: $name, status: $status, creditLimitCents: $creditLimitCents, paymentTermsDays: $paymentTermsDays) {
    id
  }
}

mutation SetCompanyCustomerGroup($companyId: ID!, $groupSlug: String!) {
  setCompanyCustomerGroup(companyId: $companyId, groupSlug: $groupSlug) {
    id
    defaultCustomerGroupSlug
  }
}

mutation SetCompanyMember($companyId: ID!, $customerId: ID!, $role: String!, $orderLimitCents: Int) {
  setCompanyMember(companyId: $companyId, customerId: $customerId, role: $role, orderLimitCents: $orderLimitCents)
}

mutation RemoveCompanyMember($customerId: ID!) {
  removeCompanyMember(customerId: $customerId)
}

mutation ReleaseCompanyCredit($companyId: ID!, $amountCents: Int!, $reason: String) {
  releaseCompanyCredit(companyId: $companyId, amountCents: $amountCents, reason: $reason) {
    id
    creditUsedCents
  }
}

query CompanyInvoices($companyId: ID!, $limit: Int) {
  companyInvoices(companyId: $companyId, limit: $limit) {
    id
    orderId
    orderNumber
    number
    amountCents
    status
    overdue
    dueAt
    paidAt
    createdAt
  }
}

# Lightweight picker feed - id+sku+name only, same idea as SkuPicker's query
query CompanyPricePickerProducts {
  products {
    id
    sku
    name
  }
}

mutation SetCompanyPrice($companyId: ID!, $productId: ID!, $priceCents: Int!) {
  setCompanyPrice(companyId: $companyId, productId: $productId, priceCents: $priceCents) {
    id
  }
}

mutation DeleteCompanyPrice($companyId: ID!, $priceId: ID!) {
  deleteCompanyPrice(companyId: $companyId, priceId: $priceId)
}

mutation MasqueradeCustomer($customerId: ID!) {
  masqueradeCustomer(customerId: $customerId) {
    storefrontPath
    storefrontUrl
    expiresInSeconds
  }
}

mutation SettleB2bInvoice($id: ID!, $status: String!) {
  settleB2bInvoice(id: $id, status: $status) {
    id
    status
    paidAt
  }
}

query B2BQuotes($status: String) {
  b2bQuotes(status: $status, limit: 100) {
    id
    companyId
    customerId
    channelId
    status
    note
    sellerNote
    totalCents
    validUntil
    createdAt
    items {
      sku
      name
      quantity
      unitPriceCents
      optionsSummary
    }
  }
}

mutation PriceB2BQuote($id: ID!, $items: [B2BQuoteItemInput!]!, $sellerNote: String) {
  priceB2BQuote(id: $id, items: $items, sellerNote: $sellerNote) {
    id
    status
    totalCents
  }
}

mutation CreateDraftOrderFromQuote($quoteId: ID!) {
  createDraftOrderFromQuote(quoteId: $quoteId) {
    id
    number
  }
}
