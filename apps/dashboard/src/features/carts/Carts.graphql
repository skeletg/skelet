query Carts($channelId: ID!, $customerId: ID, $status: String, $kind: CartKind, $abandoned: Boolean, $search: String, $limit: Int, $offset: Int) {
  carts(channelId: $channelId, customerId: $customerId, status: $status, kind: $kind, abandoned: $abandoned, search: $search, limit: $limit, offset: $offset) {
    totalCount
    items {
      id
      customerId
      customerEmail
      customerName
      status
      kind
      email
      offerState
      offerExpiresAt
      orderId
      itemCount
      subtotal
      currencyCode
      updatedAt
    }
  }
}

fragment CartFields on AdminCart {
  id
  customerId
  customerEmail
  customerName
  channelId
  currencyCode
  status
  kind
  email
  subtotal
  itemCount
  createdAt
  updatedAt
  offer {
    ...CartOfferFields
  }
  lines {
    id
    name
    sku
    unitPrice
    quantity
    totalPrice
    isSimple
    priceOverride
    isCustom
    taxClass
    components {
      id
      sku
      name
      unitPrice
      quantity
    }
    options {
      id
      optionTitle
      valueLabel
      textValue
      priceDelta
      fileUrl
    }
  }
}

query Cart($id: ID!) {
  cart(id: $id) {
    ...CartFields
  }
}

mutation AdminCreateCart($channelId: ID!, $customerId: ID) {
  adminCreateCart(channelId: $channelId, customerId: $customerId) {
    ...CartFields
  }
}

mutation AdminAddCartLine($cartId: ID!, $sku: String!, $quantity: Float!, $options: [AdminCartLineOptionInput!]) {
  adminAddCartLine(cartId: $cartId, sku: $sku, quantity: $quantity, options: $options) {
    ...CartFields
  }
}

query CartAddProductOptions($id: ID!) {
  product(id: $id) {
    id
    sku
    productOptions {
      id
      inputType
      isRequired
      sortOrder
      title
      helpText
      priceValue
      priceType
      maxChars
      visibleIf
      values {
        id
        title
        sortOrder
        priceValue
        priceType
        isDefault
      }
    }
  }
}

mutation AdminUpdateCartLine($cartId: ID!, $lineId: ID!, $quantity: Float!) {
  adminUpdateCartLine(cartId: $cartId, lineId: $lineId, quantity: $quantity) {
    ...CartFields
  }
}

mutation AdminRemoveCartLine($cartId: ID!, $lineId: ID!) {
  adminRemoveCartLine(cartId: $cartId, lineId: $lineId) {
    ...CartFields
  }
}

mutation AdminClearCart($cartId: ID!) {
  adminClearCart(cartId: $cartId) {
    ...CartFields
  }
}

mutation AdminDuplicateCart($cartId: ID!, $targetCustomerId: ID) {
  adminDuplicateCart(cartId: $cartId, targetCustomerId: $targetCustomerId) {
    ...CartFields
  }
}

fragment CartAddressFields on AdminCartAddress {
  firstName
  lastName
  company
  street1
  street2
  city
  state
  postalCode
  countryCode
  phone
}

fragment CartOfferFields on AdminCartOffer {
  state
  expiresAt
  message
  showInAccount
  locks
  paymentMethods
  link
  linkPath
  needsShipping
  sentAt
  sendCount
  openedAt
  revokedAt
  orderId
  checkout {
    shippingAddress {
      ...CartAddressFields
    }
    billingSameAsShipping
    billingAddress {
      ...CartAddressFields
    }
    paymentProviderSlug
    deliveries {
      groupKey
      optionId
      carrierSlug
      methodCode
      pointId
      pointName
    }
  }
}

mutation AdminCreateCartOffer($input: AdminCreateCartOfferInput!) {
  adminCreateCartOffer(input: $input) {
    ...CartFields
  }
}

mutation AdminUpdateCartOffer($cartId: ID!, $input: AdminUpdateCartOfferInput!) {
  adminUpdateCartOffer(cartId: $cartId, input: $input) {
    ...CartFields
  }
}

mutation AdminSetCartLinePrice($cartId: ID!, $lineId: ID!, $unitPrice: Int) {
  adminSetCartLinePrice(cartId: $cartId, lineId: $lineId, unitPrice: $unitPrice) {
    ...CartFields
  }
}

mutation AdminAddCustomCartLine($cartId: ID!, $input: AdminCustomCartLineInput!) {
  adminAddCustomCartLine(cartId: $cartId, input: $input) {
    ...CartFields
  }
}

mutation AdminSendCartOffer($cartId: ID!) {
  adminSendCartOffer(cartId: $cartId) {
    ...CartFields
  }
}

mutation AdminRegenerateCartOfferLink($cartId: ID!) {
  adminRegenerateCartOfferLink(cartId: $cartId) {
    ...CartFields
  }
}

mutation AdminRevokeCartOffer($cartId: ID!) {
  adminRevokeCartOffer(cartId: $cartId) {
    ...CartFields
  }
}

query AdminCartDeliveryGroups($cartId: ID!) {
  adminCartDeliveryGroups(cartId: $cartId) {
    key
    lines
    choices {
      optionId
      optionName
      kind
      carrierSlug
      methodCode
      methodName
      price
      needsPoint
    }
  }
}

query AdminCartDeliveryPoints($cartId: ID!, $groupKey: String!, $optionId: ID!, $search: String) {
  adminCartDeliveryPoints(cartId: $cartId, groupKey: $groupKey, optionId: $optionId, search: $search) {
    id
    name
    address
  }
}

query AdminCartOfferPaymentMethods($cartId: ID!) {
  adminCartOfferPaymentMethods(cartId: $cartId) {
    slug
    displayName
  }
}

query AdminCartOfferEmailPreview($cartId: ID!) {
  adminCartOfferEmailPreview(cartId: $cartId) {
    to
    subject
    html
    text
    link
    linkComplete
  }
}
