# Slim server-searched picker feed - id/name/sku/kind plus price for the cart picker
# Every product dropdown goes through this instead of the 1000-capped full list
query ProductPicker($search: String, $kinds: [ProductKind!], $limit: Int) {
  productsPaged(search: $search, kinds: $kinds, limit: $limit) {
    items {
      id
      name
      sku
      kind
      defaultPrice
      defaultCurrencyCode
    }
  }
}

# Source for the shared ProductPickerDialog - server-paged, so a picker never hydrates the whole
# catalogue. attributeValues rides along only for callers that show or filter by option values
query ProductPickerPaged(
  $search: String
  $kinds: [ProductKind!]
  $productTypeSlugs: [String!]
  $published: Boolean
  $attributeValueIds: [ID!]
  $limit: Int
  $offset: Int
  $withAttributes: Boolean! = false
) {
  productsPaged(
    search: $search
    kinds: $kinds
    productTypeSlugs: $productTypeSlugs
    published: $published
    attributeValueIds: $attributeValueIds
    limit: $limit
    offset: $offset
  ) {
    totalCount
    items {
      id name sku kind defaultPrice defaultCurrencyCode
      productType { id slug name }
      thumbnail { id url altText status }
      displayImage { id url altText status }
      attributeValues @include(if: $withAttributes) {
        attribute { id slug name }
        selectedValues { id slug name value }
      }
    }
  }
}

query ProductCount($channelId: ID) {
  productsPaged(channelId: $channelId, limit: 1) {
    totalCount
  }
}

query ProductsPaged(
  $channelId: ID
  $search: String
  $kinds: [ProductKind!]
  $productTypeSlugs: [String!]
  $published: Boolean
  $attributeValueIds: [ID!]
  $sortKey: String
  $sortDesc: Boolean
  $limit: Int
  $offset: Int
) {
  productsPaged(
    channelId: $channelId
    search: $search
    kinds: $kinds
    productTypeSlugs: $productTypeSlugs
    published: $published
    attributeValueIds: $attributeValueIds
    sortKey: $sortKey
    sortDesc: $sortDesc
    limit: $limit
    offset: $offset
  ) {
    totalCount
    items {
    id
    url
    name
    kind
    shortDescription
    content {
      name
      shortDescription
      locale
    }
    mainImage {
      id
      url
      altText
      status
    }
    displayImage {
      id
      url
      altText
      status
    }
    thumbnail {
      id
      url
      altText
      status
    }
    ogImage {
      id
      url
      altText
      status
    }
    sku
    defaultPrice
    defaultCurrencyCode
    attributeValues {
      attribute {
        id
        slug
        name
        inputType
        relationshipTarget
      }
      selectedValues {
        id
        slug
        name
        value
      }
      scalarValue
      references {
        targetType
        targetId
        label
        url
      }
    }
    listings {
      isPublished
      price
      url
      effectivePrice
      effectiveCurrency
      channel {
        id
        slug
        name
        currencyCode
      }
    }
    productType {
      id
      slug
      name

    }
    createdAt
    updatedAt
  }
  }
}

