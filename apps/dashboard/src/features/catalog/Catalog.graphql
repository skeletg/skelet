# Product detail sidebar - stock, sales and review counts in one round trip
# Split from the big Product query so the sidebar can refetch independently of the editor form
query ProductSidebarStats($id: ID!, $sku: String!, $days: Int, $channelId: ID) {
  product(id: $id) {
    id
    salableQuantity(channelId: $channelId)
    inStock(channelId: $channelId)
  }
  productSales(sku: $sku, days: $days, channelId: $channelId) {
    unitsSold
    revenue
    orderCount
    margin
    days
  }
  reviewCounts(productId: $id) {
    approved
    pending
    total
  }
}


# Storefront traffic for one product page, served by the Signals API - Lens keys pages by URL path, so the product's own url is the key
query ProductTraffic($channelId: ID!, $pageKey: String!) {
  lensPageStats(channelId: $channelId, pageKey: $pageKey) {
    views
    visitors
    clicks
    avgScroll
  }
}

