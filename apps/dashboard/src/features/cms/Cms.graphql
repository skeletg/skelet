fragment CmsAttributeValueRow on CMSAttributeValue {
  id
  attributeId
  slug
  position
  allContent {
    locale
    name
  }
  createdAt
}

fragment CmsAttributeRow on CMSAttribute {
  id
  slug
  inputType
  isTranslatable
  isRequiredDefault
  unit
  validation
  defaultValue
  relationshipTarget
  values {
    ...CmsAttributeValueRow
  }
  content {
    locale
    name
    helperText
    placeholder
  }
  allContent {
    locale
    name
    helperText
    placeholder
    updatedAt
  }
  createdAt
  updatedAt
}

fragment CmsAttributeGroupRow on CMSAttributeGroup {
  id
  slug
  position
  createdAt
  updatedAt
}

fragment CmsPageTypeRow on CMSPageType {
  id
  slug
  icon
  isSystem
  position
  rootSlug
  channelRoots {
    channelId
    rootSlug
  }
  defaultBlocks
  defaultMetaTitle
  defaultSeoNoindex
  isSingleton
  pageCount
  content {
    locale
    name
    description
  }
  allContent {
    locale
    name
    description
    updatedAt
  }
  attributes {
    groupId
    position
    isRequired
    conditionAttributeId
    conditionValue
    attribute {
      ...CmsAttributeRow
    }
  }
  createdAt
  updatedAt
}

fragment CmsPageVariantRow on CMSPageVariant {
  variantKey
  body
}

fragment CmsPageRow on CMSPage {
  experimentKey
  variants {
    ...CmsPageVariantRow
  }
  id
  pageTypeId
  parentId
  slug
  urlPath
  position
  isPublished
  seoNoindex
  publishedAt
  scheduledAt
  data
  tags
  metadata {
    key
    value
  }
  workflowState
  assignedTo
  submittedBy
  submittedAt
  approvedBy
  approvedAt
  content {
    locale
    title
    body
    metaTitle
    metaDescription
    metaKeywords
    data
  }
  allContent {
    locale
    title
    body
    metaTitle
    metaDescription
    metaKeywords
    data
    updatedAt
  }
  selections {
    attributeId
    valueId
  }
  relationships {
    attributeId
    targetType
    targetId
    position
  }
  channelListings {
    channelId
    isPublished
    seoNoindex
    isHomepage
  }
  createdAt
  updatedAt
}

mutation SetCmsPageChannelListing($input: SetCMSPageChannelListingInput!) {
  setCMSPageChannelListing(input: $input) {
    ...CmsPageRow
  }
}

mutation DeleteCmsPageChannelListing($pageId: ID!, $channelId: ID!) {
  deleteCMSPageChannelListing(pageId: $pageId, channelId: $channelId) {
    ...CmsPageRow
  }
}

# Searchable internal-link targets for the block link-field picker.
query Linkables($search: String, $limit: Int) {
  linkables(search: $search, limit: $limit) {
    entityType
    entityId
    label
    path
  }
}

