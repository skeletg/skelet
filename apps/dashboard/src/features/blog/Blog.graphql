}

# ==================== Posts ====================

query BlogPosts($filter: BlogPostFilter, $limit: Int, $offset: Int) {
  blogPosts(filter: $filter, limit: $limit, offset: $offset) {
    items {
      ...BlogPostRow
    }
  }
}

query BlogPost($id: ID, $slug: String, $includeUnpublished: Boolean) {
  blogPost(id: $id, slug: $slug, includeUnpublished: $includeUnpublished) {
    ...BlogPostRow
  }
}

mutation CreateBlogPost($input: CreateBlogPostInput!) {
  createBlogPost(input: $input) {
    ...BlogPostRow
  }
}

mutation UpdateBlogPost($input: UpdateBlogPostInput!) {
  updateBlogPost(input: $input) {
    ...BlogPostRow
  }
}

mutation UpsertBlogPostContent($input: UpsertBlogPostContentInput!) {
  upsertBlogPostContent(input: $input) {
    ...BlogPostRow
  }
}

mutation DeleteBlogPostContent($postId: ID!, $locale: String!) {
  deleteBlogPostContent(postId: $postId, locale: $locale)
}

mutation PublishBlogPost($id: ID!) {
  publishBlogPost(id: $id) {
    ...BlogPostRow
  }
}

mutation ScheduleBlogPost($id: ID!, $publishedAt: Time!) {
  scheduleBlogPost(id: $id, publishedAt: $publishedAt) {
    ...BlogPostRow
  }
}

mutation UnpublishBlogPost($id: ID!) {
  unpublishBlogPost(id: $id) {
    ...BlogPostRow
  }
}

mutation ArchiveBlogPost($id: ID!) {
  archiveBlogPost(id: $id) {
    ...BlogPostRow
  }
}

mutation SetBlogPostCategories($postId: ID!, $categoryIds: [ID!]!) {
  setBlogPostCategories(postId: $postId, categoryIds: $categoryIds) {
    ...BlogPostRow
  }
}

mutation SetBlogPostTags($postId: ID!, $tagIds: [ID!]!) {
  setBlogPostTags(postId: $postId, tagIds: $tagIds) {
    ...BlogPostRow
  }
}

mutation SetBlogPostChannelListing($input: SetBlogPostChannelListingInput!) {
  setBlogPostChannelListing(input: $input) {
    ...BlogPostRow
  }
}

mutation DeleteBlogPostChannelListing($postId: ID!, $channelId: ID!) {
  deleteBlogPostChannelListing(postId: $postId, channelId: $channelId) {
    ...BlogPostRow
  }
}

mutation DeleteBlogPost($id: ID!) {
  deleteBlogPost(id: $id)
}

mutation MintBlogPostPreviewToken($input: MintBlogPostPreviewTokenInput!) {
  mintBlogPostPreviewToken(input: $input) {
    token
    expiresAt
  }
}
