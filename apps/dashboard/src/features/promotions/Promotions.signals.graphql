# Segment operations, served by the Signals API - audiences are a Signals capability, and the .signals.graphql suffix routes them there

query CustomerSegmentsList($limit: Int, $offset: Int) {
  customerSegments(limit: $limit, offset: $offset) {
    items {
      id
      slug
      name
      description
      isActive
      memberCount
    }
    totalCount
  }
}
mutation CreateCustomerSegment($input: CreateCustomerSegmentInput!) {
  createCustomerSegment(input: $input) {
    id
    slug
    name
  }
}
mutation UpdateCustomerSegment($input: UpdateCustomerSegmentInput!) {
  updateCustomerSegment(input: $input) {
    id
    slug
    name
    isActive
  }
}
mutation DeleteCustomerSegment($id: ID!) {
  deleteCustomerSegment(id: $id)
}
