query SynapseOverview($channelId: ID!, $sinceDays: Int) {
  synapseOverview(channelId: $channelId, sinceDays: $sinceDays) {
    totalEvents
    pageViews
    conversions
    identifiedCustomers
    anonymousVisitors
    revenue {
      currency
      cents
      orders
    }
    topEvents {
      name
      count
    }
    activeCustomers {
      customerId
      events
      lastSeen
    }
    activeVisitors {
      anonId
      events
      lastSeen
      lastPage
    }
  }
}

# A single customer's full behavioural profile - the per-customer drill-down
# reached from the Synapse overview's "most active customers" list. Lives under
# Synapse (not the customer record, which is operational, not analytical).
query CustomerProfile($customerId: ID!, $sinceDays: Int) {
  customerProfile(customerId: $customerId, sinceDays: $sinceDays) {
    firstSeen
    lastSeen
    totalEvents
    pageViews
    conversions
    revenue {
      currency
      cents
      orders
    }
    counts {
      name
      count
    }
    timeline {
      eventName
      occurredAt
      source
      summary
      detailsJson
    }
    devices {
      value
      count
    }
    browsers {
      value
      count
    }
    referrers {
      value
      count
    }
    ipAddresses {
      value
      count
    }
    operatingSystems { value count }
    screens { value count }
    countries { value count }
    sources { value count }
    campaigns { value count }
    topPages { title pageKey views dwellSeconds }
    pagesViewedTotal
    topProducts { name image price sku views }
    searches { value count }
    sessions
    traits {
      lifecycle
      rfmRecency
      rfmFrequency
      rfmMonetary
      recencyDays
      frequency
      monetaryCents
      engagementScore
      churnRisk
      predictedClvCents
      nextOrderDays
    }
    experiments {
      experiment
      variation
      lastExposedAt
    }
    affinities {
      slug
      name
      values {
        value
        count
      }
    }
  }
}

