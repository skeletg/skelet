# Minimal customer identity for the Synapse profile page header (name + email),
# so a deep link / refresh resolves the person without the heavy Customer query.
query SynapseCustomerHeader($id: ID!) {
  customer(id: $id) {
    id
    email
    firstName
    lastName
  }
}

# The core half of a customer's 360° rollup - consent, email engagement and automation-flow enrollments (Pulse)
# Their audiences come from the Signals API alongside it - customer-only, an anonymous visitor has none
query CustomerSignals($customerId: ID!) {
  customerSignals(customerId: $customerId) {
    consents { kind name channel purpose optedIn }
    email { sent opened clicked lastSentAt lastOpenAt }
    flows { flowId flowName trigger status enrolledAt updatedAt }
  }
}

# Commerce/CRM summary for a customer - shown alongside the behavioural profile
# on the Synapse customer page (customer-only; anonymous visitors have none).
query CustomerCommerce($customerId: ID!) {
  customerCommerce(customerId: $customerId) {
    orders
    spend {
      currency
      cents
      orders
    }
    firstOrderAt
    lastOrderAt
    returns
    activeSubscriptions
    marketingOptedIn
    group
    memberSince
  }
}
