mutation AdminDeleteAddress($id: ID!) {
  adminDeleteAddress(id: $id)
}

mutation DeleteCustomer($id: ID!) {
  deleteCustomer(id: $id)
}

mutation SetCustomerActive($id: ID!, $active: Boolean!) {
  setCustomerActive(id: $id, active: $active) {
    id
    isActive
  }
}



query ExportCustomerData($customerId: ID!) {
  exportCustomerData(customerId: $customerId)
}

mutation AnonymizeCustomer($customerId: ID!) {
  anonymizeCustomer(customerId: $customerId)
}

query StoreCredit($customerId: ID!) {
  storeCredit(customerId: $customerId) {
    balanceCents
    currencyCode
    entries {
      id
      amountCents
      currencyCode
      reason
      orderId
      createdAt
    }
  }
}

mutation AdjustStoreCredit($customerId: ID!, $amountCents: Int!, $reason: String!) {
  adjustStoreCredit(customerId: $customerId, amountCents: $amountCents, reason: $reason) {
    balanceCents
    currencyCode
  }
}

query Loyalty($customerId: ID!) {
  loyalty(customerId: $customerId) {
    balancePoints
    entries {
      id
      points
      reason
      orderId
      createdAt
    }
  }
}

mutation AdjustLoyaltyPoints($customerId: ID!, $points: Int!, $reason: String!) {
  adjustLoyaltyPoints(customerId: $customerId, points: $points, reason: $reason) {
    balancePoints
  }
}

query CustomerConsentHistory($customerId: ID!) {
  customerConsentHistory(customerId: $customerId, limit: 200) {
    id
    kind
    optedIn
    source
    adminId
    createdAt
  }
}
