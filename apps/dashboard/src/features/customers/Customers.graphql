query CustomersPaged(
  $channelId: ID
  $search: String
  $groupSlug: String
  $isActive: Boolean
  $limit: Int
  $offset: Int
) {
  customersPaged(
    channelId: $channelId
    search: $search
    groupSlug: $groupSlug
    isActive: $isActive
    limit: $limit
    offset: $offset
  ) {
    totalCount
    items {
      id
      email
      firstName
      lastName
      phone
      isActive
      isEmailVerified
      createdAt
      group {
        id
        slug
        name
      }
    }
  }
}

query Customer($id: ID!) {
  customer(id: $id) {
    id
    channelId
    email
    firstName
    lastName
    phone
    isActive
    isEmailVerified
    note
    taxExempt
    taxExemptionNote
    vatId
    vatIdStatus
    vatIdCheckedAt
    createdAt
    updatedAt
    metadata {
      key
      value
    }
    group {
      id
      slug
      name
    }
    addresses {
      id
      firstName
      lastName
      company
      street1
      street2
      city
      state
      postalCode
      countryCode
      phone
    }
    defaultBillingAddress {
      id
    }
    defaultShippingAddress {
      id
    }
    consents {
      kind
      optedIn
      source
      updatedAt
      isDefault
      definition {
        slug
        name
        description
        purpose
        channel
        required
        defaultOptIn
      }
    }
  }
}

mutation SetCustomerTaxStatus($customerId: ID!, $taxExempt: Boolean!, $note: String) {
  setCustomerTaxStatus(customerId: $customerId, taxExempt: $taxExempt, note: $note) {
    id
    taxExempt
    taxExemptionNote
  }
}

mutation SetCustomerVatId($customerId: ID!, $vatId: String!) {
  setCustomerVatId(customerId: $customerId, vatId: $vatId) {
    id
    vatId
    vatIdStatus
    vatIdCheckedAt
  }
}

mutation SetCustomerGroup($customerId: ID!, $groupId: ID!) {
  setCustomerGroup(customerId: $customerId, groupId: $groupId) {
    id
    group {
      id
      slug
      name
    }
  }
}

mutation AdminCreateCustomer($input: AdminCreateCustomerInput!) {
  adminCreateCustomer(input: $input) {
    id
    email
    firstName
    lastName
    isActive
    isEmailVerified
    group {
      id
      slug
      name
    }
  }
}

