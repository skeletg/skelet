fragment ExperimentFields on Experiment {
  id
  channelId
  key
  name
  status
  coverage
  goalEvent
  segmentSlug
  variations {
    key
    name
    weight
    value
  }
  createdAt
  updatedAt
}

query Experiments($channelId: ID!) {
  experiments(channelId: $channelId) {
    ...ExperimentFields
  }
}

query ExperimentsOverview($channelId: ID!, $sinceDays: Int) {
  experimentsOverview(channelId: $channelId, sinceDays: $sinceDays) {
    running
    draft
    stopped
    totalExposed
    decided
    experiments {
      id
      key
      name
      variations
      coverage
      totalExposed
      conversions
      leader
      leaderRate
      leaderUplift
      leaderChanceToWin
      leaderIsControl
      winner
      sampleRatioMismatch
    }
  }
}

query Experiment($id: ID!) {
  experiment(id: $id) {
    ...ExperimentFields
  }
}

query ExperimentGoalEvents($channelId: ID!) {
  experimentGoalEvents(channelId: $channelId)
}

query ExperimentResults($id: ID!, $sinceDays: Int) {
  experimentResults(id: $id, sinceDays: $sinceDays) {
    winner
    sampleRatioMismatch
    totalExposed
    totalRevenue
    variations {
      variation
      name
      exposed
      converted
      revenueCents
      rate
      ciLow
      ciHigh
      uplift
      chanceToWin
      isControl
      significant
    }
  }
}

mutation CreateExperiment($input: SaveExperimentInput!) {
  createExperiment(input: $input) {
    ...ExperimentFields
  }
}

mutation UpdateExperiment($id: ID!, $input: SaveExperimentInput!) {
  updateExperiment(id: $id, input: $input) {
    ...ExperimentFields
  }
}

mutation DeleteExperiment($id: ID!) {
  deleteExperiment(id: $id)
}

query PrismSegments {
  experimentSegments {
    slug
    name
  }
}
