query Channels {
  channels {
    id
    slug
    name
    defaultLocale
    locales {
      code
      name
      nativeName
      isActive
      isRTL
      sortOrder
    }
    isActive
    isDefault
    currencyCode
    publicUrl
    metadata {
      key
      value
    }
    createdAt
  }
}

query Channel($id: ID!) {
  channel(id: $id) {
    id
    slug
    name
    defaultLocale
    locales {
      code
      name
      nativeName
      isActive
      isRTL
      sortOrder
    }
    isActive
    isDefault
    currencyCode
    publicUrl
    metadata {
      key
      value
    }
    createdAt
  }
}

mutation CreateChannel($input: CreateChannelInput!) {
  createChannel(input: $input) {
    id
    slug
    name
    defaultLocale
    locales {
      code
      name
      nativeName
      isActive
      isRTL
      sortOrder
    }
    isActive
    currencyCode
    publicUrl
  }
}

mutation UpdateChannel($input: UpdateChannelInput!) {
  updateChannel(input: $input) {
    id
    name
    defaultLocale
    locales {
      code
      name
      nativeName
      isActive
      isRTL
      sortOrder
    }
    isActive
    isDefault
    currencyCode
    publicUrl
    metadata {
      key
      value
    }
  }
}

mutation DeleteChannel($id: ID!) {
  deleteChannel(id: $id)
}

mutation SetChannelAsDefault($channelId: ID!) {
  setChannelAsDefault(channelId: $channelId) {
    id
    isDefault
  }
}
