fragment BoardReportFields on BoardReport {
  title
  size
  definition {
    kind
    sinceDays
    event
    measure
    unit
    breakdown
    steps
    filters {
      step
      key
      value
    }
    windowHours
    startEvent
    returnEvent
    periods
    depth
    windowDays
  }
}

query Boards($channelId: ID!, $all: Boolean) {
  boards(channelId: $channelId, all: $all) {
    id
    name
    updatedAt
    reportCount
    status
    access
    favourite
    draftUpdatedAt
    owner {
      id
      name
      removed
    }
  }
}

query Board($channelId: ID!, $id: ID!) {
  board(channelId: $channelId, id: $id) {
    ...BoardFull
  }
}

fragment BoardFull on Board {
  id
  name
  updatedAt
  status
  access
  favourite
  owner {
    id
    name
    removed
  }
  reports {
    ...BoardReportFields
  }
  shares {
    adminId
    roleId
    name
    level
  }
  draft {
    payload
    baseUpdatedAt
    updatedAt
  }
}

query BoardShareTargets($channelId: ID!) {
  boardShareTargets(channelId: $channelId) {
    kind
    id
    name
    seesBoards
    seesData
  }
}

mutation CreateBoard($channelId: ID!, $name: String!, $reports: [BoardReportInput!]) {
  createBoard(channelId: $channelId, name: $name, reports: $reports) {
    id
  }
}

mutation SaveBoard($channelId: ID!, $id: ID!, $name: String!, $reports: [BoardReportInput!]!, $readAt: Time!) {
  saveBoard(channelId: $channelId, id: $id, name: $name, reports: $reports, readAt: $readAt) {
    ...BoardFull
  }
}

mutation DeleteBoard($channelId: ID!, $id: ID!) {
  deleteBoard(channelId: $channelId, id: $id)
}

mutation CreateStarterBoards($channelId: ID!) {
  createStarterBoards(channelId: $channelId) {
    id
  }
}

mutation SetBoardShares($channelId: ID!, $id: ID!, $shares: [BoardShareInput!]!) {
  setBoardShares(channelId: $channelId, id: $id, shares: $shares) {
    ...BoardFull
  }
}

mutation MakeShopBoard($channelId: ID!, $id: ID!) {
  makeShopBoard(channelId: $channelId, id: $id) {
    ...BoardFull
  }
}

mutation ClaimBoard($channelId: ID!, $id: ID!) {
  claimBoard(channelId: $channelId, id: $id) {
    ...BoardFull
  }
}

mutation SetBoardFavourite($channelId: ID!, $id: ID!, $favourite: Boolean!) {
  setBoardFavourite(channelId: $channelId, id: $id, favourite: $favourite)
}

mutation SaveBoardDraft($channelId: ID!, $id: ID!, $payload: JSON!, $baseUpdatedAt: Time!) {
  saveBoardDraft(channelId: $channelId, id: $id, payload: $payload, baseUpdatedAt: $baseUpdatedAt)
}

mutation DiscardBoardDraft($channelId: ID!, $id: ID!) {
  discardBoardDraft(channelId: $channelId, id: $id)
}
