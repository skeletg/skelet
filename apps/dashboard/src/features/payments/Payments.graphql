query PaymentMethods($channelId: ID!) {
  paymentMethods(channelId: $channelId) {
    providerSlug
    displayName
    isOffline
    isAvailable
    isEnabled
    sortOrder
    countryMode
    allowedCountries
  }
}

mutation SetPaymentMethodEnabled($channelId: ID!, $providerSlug: String!, $enabled: Boolean!) {
  setPaymentMethodEnabled(channelId: $channelId, providerSlug: $providerSlug, enabled: $enabled) {
    providerSlug
    isEnabled
  }
}

mutation SetPaymentMethodCountries($channelId: ID!, $providerSlug: String!, $mode: String!, $countries: [String!]!) {
  setPaymentMethodCountries(channelId: $channelId, providerSlug: $providerSlug, mode: $mode, countries: $countries) {
    providerSlug
    countryMode
    allowedCountries
  }
}

query PaymentProviders($channelId: ID) {
  paymentProviders(channelId: $channelId) {
    slug
    displayName
    isOffline
    isAvailable
    pluginSlug
    pluginName
    pluginVersion
    configurationPaths
    webhookPath
  }
}

mutation UpdatePaymentMethodPresentation($channelId: ID!, $providerSlug: String!, $displayName: String!, $sortOrder: Int!) {
  updatePaymentMethodPresentation(channelId: $channelId, providerSlug: $providerSlug, displayName: $displayName, sortOrder: $sortOrder) {
    providerSlug
    displayName
    sortOrder
  }
}
