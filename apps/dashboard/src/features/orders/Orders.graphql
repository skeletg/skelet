# The dashboard's queue counts in one round-trip. Aliased totalCount reads with
# limit: 1 - four separate queries would be four requests for four integers.
query OrderQueueCounts($channelId: ID) {
  pending: ordersPaged(statuses: ["PENDING"], limit: 1, channelId: $channelId) {
    totalCount
  }
  toFulfil: ordersPaged(statuses: ["CONFIRMED", "PROCESSING", "PARTIALLY_FULFILLED"], limit: 1, channelId: $channelId) {
    totalCount
  }
  onHold: ordersPaged(statuses: ["ON_HOLD"], limit: 1, channelId: $channelId) {
    totalCount
  }
  unpaid: ordersPaged(paymentStatuses: ["UNPAID"], limit: 1, channelId: $channelId) {
    totalCount
  }
}
