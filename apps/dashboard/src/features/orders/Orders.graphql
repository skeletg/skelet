query OrdersPaged($search: String, $statuses: [String!], $paymentStatuses: [String!], $limit: Int, $offset: Int, $channelId: ID) {
  ordersPaged(search: $search, statuses: $statuses, paymentStatuses: $paymentStatuses, limit: $limit, offset: $offset, channelId: $channelId) {
    totalCount
    items {
      id
      number
      status
      paymentStatus
      total
      currencyCode
      createdAt
      shippingAddress {
        firstName
        lastName
      }
    }
  }
}

query Orders {
  orders {
    id
    number
    status
    paymentStatus
    total
    currencyCode
    createdAt
    shippingAddress {
      firstName
      lastName
    }
  }
}

query Order($id: ID!) {
  order(id: $id) {
    id
    channelId
    number
    status
    paymentStatus
    paymentProvider
    paymentReference
    email
    customerId
    subtotal
    shippingAmount
    discountAmount
    taxAmount
    total
    giftCardAmount
    storeCreditAmount
    currencyCode
    customerNote
    carrier
    trackingNumber
    trackingUrl
    createdAt
    billingAddress {
      firstName
      lastName
      company
      street1
      street2
      city
      state
      postalCode
      countryCode
      phone
    }
    shippingAddress {
      firstName
      lastName
      company
      street1
      street2
      city
      state
      postalCode
      countryCode
      phone
    }
    lines {
      id
      productName
      productSku
      unitPrice
      quantity
      totalPrice
      isGift
      components {
        id
        productSku
        productName
        unitPrice
        quantity
      }
      options {
        id
        optionTitle
        valueLabel
        textValue
        priceDelta
        quantity
        fileUrl
      }
    }
    events {
      id
      type
      message
      createdAt
    }
    fulfillments {
      id
      sequence
      status
      carrier
      trackingNumber
      insuredValueCents
      shippedAt
      lines {
        id
        orderLineId
        quantity
      }
      labels {
        id
        format
        trackingNumber
        dataUrl
        createdAt
      }
    }
    paymentTransactions {
      id
      kind
      amount
      status
      providerSlug
      providerReference
      reason
      createdAt
    }
    taxLines {
      id
      ruleId
      name
      rateBps
      amount
    }
    appliedPromotions {
      id
      ruleId
      ruleName
      ruleSlug
      code
      discount
      appliedAt
    }
    returns {
      id
      rmaNumber
      status
      reason
      restock
      refundTarget
      refundAmount
      lines {
        id
        orderLineId
        quantity
        reason
        refundUnitCents
      }
      createdAt
      updatedAt
    }
  }
}

