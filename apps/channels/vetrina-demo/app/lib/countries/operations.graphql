query Countries {
  countries(activeOnly: true) {
    code
    name
    emojiFlag
  }
}

query Regions($countryCode: String!) {
  regions(countryCode: $countryCode) {
    code
    name
  }
}

query CountrySettings {
  countrySettings {
    defaultCountryCode
    allowOptionalState
    requiredRegionCountryCodes
  }
}

query PhoneSettings {
  phoneSettings {
    restrictedToStoreCountries
    lockedCountryCode
    defaultCountryCode
    formats {
      countryCode
      callingCode
      example
      nationalExample
      template
    }
  }
}
