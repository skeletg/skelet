query MyCompany {
  myCompany {
    name
    status
    role
    creditLimitCents
    creditUsedCents
    paymentTermsDays
  }
}

query MyQuotes {
  myQuotes {
    id
    status
    note
    sellerNote
    totalCents
    validUntil
    createdAt
    items {
      sku
      name
      quantity
      unitPriceCents
      optionsSummary
    }
  }
}

query MyCompanyOrders {
  myCompanyOrders {
    id
    number
    status
    paymentStatus
    totalCents
    currencyCode
    memberEmail
    createdAt
  }
}

query MyCompanyInvoices {
  myCompanyInvoices {
    number
    orderNumber
    amountCents
    status
    overdue
    dueAt
    paidAt
    createdAt
  }
}

mutation RequestQuote($cartId: ID!, $note: String) {
  requestQuote(cartId: $cartId, note: $note) {
    id
    status
  }
}

mutation RespondToQuote($id: ID!, $accept: Boolean!) {
  respondToQuote(id: $id, accept: $accept) {
    id
    status
  }
}
