fragment OrderAddressFields on OrderAddress {
  firstName
  lastName
  company
  street1
  street2
  city
  state
  postalCode
  countryCode
  phone
}

fragment OrderSummaryFields on Order {
  id
  number
  status
  paymentStatus
  paymentProvider
  paymentInstructions
  subtotal
  shippingAmount
  discountAmount
  taxAmount
  total
  # Tenders. These don't reduce `total` (they're payment, not discount) -
  # amountDue is what's left owing after them, and the receipt has to show
  # all three or a customer who paid with credit sees only the gross total.
  giftCardAmount
  storeCreditAmount
  amountDue
  currencyCode
  customerNote
  carrier
  trackingNumber
  trackingUrl
  createdAt
  billingAddress {
    ...OrderAddressFields
  }
  shippingAddress {
    ...OrderAddressFields
  }
  lines {
    id
    name
    sku
    unitPrice
    quantity
    totalPrice
    options {
      id
      optionTitle
      valueLabel
      textValue
      priceDelta
      quantity
      fileUrl
    }
  }
}

query ShippingQuotes($countryCode: String!, $cartId: ID, $regionCode: String, $postalCode: String) {
  shippingQuotes(countryCode: $countryCode, cartId: $cartId, regionCode: $regionCode, postalCode: $postalCode) {
    carrierSlug
    carrierName
    code
    name
    priceCents
    estimatedDays
  }
}

# With the cart, only the methods its checkout can pay with - purchase order needs a business purchase that asked for the PO number
query PaymentMethods($countryCode: String!, $cartId: ID) {
  paymentMethods(countryCode: $countryCode, cartId: $cartId) {
    providerSlug
    displayName
    sortOrder
    instructions
  }
}

query MyOrders {
  myOrders {
    id
    number
    status
    paymentStatus
    total
    currencyCode
    createdAt
    # Lines kept off the list view; detail page hydrates them. Keeps
    # the orders page snappy when a customer has hundreds of orders.
  }
}

query MyOrder($id: ID!) {
  myOrder(id: $id) {
    ...OrderSummaryFields
    events {
      id
      type
      message
      createdAt
    }
    # Per-line returnable remainder; non-empty only once shipped. Drives the
    # self-service return form (caps each line at its quantity).
    returnableLines {
      orderLineId
      quantity
    }
    # The customer's return requests against this order + their status.
    returns {
      id
      rmaNumber
      status
      reason
      refundTarget
      refundAmount
      createdAt
      lines {
        id
        orderLineId
        quantity
        reason
      }
    }
  }
}

mutation Reorder($orderId: ID!) {
  reorder(orderId: $orderId) {
    added
    skipped {
      name
      sku
      reason
    }
    cart {
      id
    }
  }
}

mutation RequestReturn($input: RequestReturnInput!) {
  requestReturn(input: $input) {
    id
    rmaNumber
    status
  }
}

# Everything placeOrder reads comes from the cart - the steps below saved it
mutation PlaceOrder($cartId: ID, $paymentToken: String, $savedPaymentMethodId: ID, $acceptTerms: Boolean) {
  placeOrder(cartId: $cartId, paymentToken: $paymentToken, savedPaymentMethodId: $savedPaymentMethodId, acceptTerms: $acceptTerms) {
    id
    number
    total
    giftCardAmount
    storeCreditAmount
    amountDue
    paymentClientSecret
  }
}

# After the customer completes a client-side 3DS challenge, verifies the
# authorization with the gateway and records it. Idempotent.
mutation FinalizeOrderPayment($orderId: ID!) {
  finalizeOrderPayment(orderId: $orderId)
}

# Balance check for the /gift-card page. Rate-limited per IP server-side.
query GiftCardBalance($code: String!) {
  giftCardBalance(code: $code) {
    balanceCents
    currencyCode
    active
  }
}

query GuestOrder($id: ID!, $email: String!) {
  guestOrder(id: $id, email: $email) {
    ...OrderSummaryFields
    events {
      id
      type
      message
      createdAt
    }
  }
}

# Collect-in-store points, rendered alongside the pickup entries the
# shipping-quote list already returns (carrierSlug "pickup"). Keyed by the
# slug embedded in each quote code as "loc-<slug>".
query PickupLocations {
  pickupLocations {
    slug
    name
    line1
    city
    postalCode
    countryCode
    instructions
  }
}

# --- Checkout state, saved on the cart one step at a time ---

fragment CheckoutAddressFields on CartAddress {
  firstName
  lastName
  company
  street1
  street2
  city
  state
  postalCode
  countryCode
  phone
  sourceAddressId
}

# Prices shipping and tax server-side, so only the checkout page selects it
query CheckoutState($id: ID!) {
  cart(id: $id) {
    id
    checkout {
      email
      destination {
        countryCode
        regionCode
        postalCode
      }
      shippingMethod {
        carrierSlug
        carrierName
        code
        name
        priceCents
        estimatedDays
      }
      isPickup
      phone
      purchaseType
      company
      businessIds {
        key
        value
      }
      poNumber
      shippingAddress {
        ...CheckoutAddressFields
      }
      billingSameAsShipping
      billingAddress {
        ...CheckoutAddressFields
      }
      pickupContact {
        firstName
        lastName
        someoneElse
      }
      paymentProviderSlug
      giftCards {
        code
        appliedCents
        balanceCents
      }
      useStoreCredit
      totals {
        subtotalCents
        discountCents
        shippingCents
        taxCents
        totalCents
        giftCardCents
        storeCreditCents
        amountDueCents
      }
    }
  }
}

# Each step returns the cart id only - the action refreshes the page, which re-reads CheckoutState
mutation SetCheckoutDestination($cartId: ID!, $countryCode: String!, $regionCode: String, $postalCode: String!) {
  setCartDestination(cartId: $cartId, countryCode: $countryCode, regionCode: $regionCode, postalCode: $postalCode) {
    id
  }
}

mutation SetCheckoutShippingMethod($cartId: ID!, $carrierSlug: String!, $code: String!) {
  setCartShippingMethod(cartId: $cartId, carrierSlug: $carrierSlug, code: $code) {
    id
  }
}

# Returns whether a method is still chosen - an address in another postcode can drop it, and the action says so
mutation SetCheckoutDetails($cartId: ID!, $input: CheckoutDetailsInput!) {
  setCartDetails(cartId: $cartId, input: $input) {
    id
    checkout {
      shippingMethod {
        code
      }
    }
  }
}

mutation SetCheckoutPaymentMethod($cartId: ID!, $providerSlug: String!) {
  setCartPaymentMethod(cartId: $cartId, providerSlug: $providerSlug) {
    id
  }
}

mutation ApplyCheckoutGiftCard($cartId: ID!, $code: String!) {
  applyGiftCard(cartId: $cartId, code: $code) {
    id
  }
}

mutation RemoveCheckoutGiftCard($cartId: ID!, $code: String!) {
  removeGiftCard(cartId: $cartId, code: $code) {
    id
  }
}

mutation SetCheckoutStoreCredit($cartId: ID!, $use: Boolean!) {
  setCartStoreCredit(cartId: $cartId, use: $use) {
    id
  }
}
