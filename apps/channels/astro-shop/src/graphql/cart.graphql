fragment CartLines on Cart {
  id
  subtotal
  totalDiscount
  lines {
    id
    name
    sku
    imageUrl
    unitPrice
    quantity
    totalPrice
  }
}

query Cart($id: ID!) {
  cart(id: $id) {
    ...CartLines
  }
}

mutation CreateCart {
  createGuestCart {
    id
  }
}

mutation AddLine($cartId: ID!, $sku: String!, $quantity: Float!) {
  addToCart(cartId: $cartId, sku: $sku, quantity: $quantity) {
    ...CartLines
  }
}

mutation UpdateLine($cartId: ID!, $lineId: ID!, $quantity: Float!) {
  updateCartLine(cartId: $cartId, lineId: $lineId, quantity: $quantity) {
    ...CartLines
  }
}

mutation RemoveLine($cartId: ID!, $lineId: ID!) {
  removeFromCart(cartId: $cartId, lineId: $lineId) {
    ...CartLines
  }
}
