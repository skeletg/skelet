# golangci-lint configuration for the SDK module - core's floor without the plugin boundary rule, which
# belongs to the module plugins compile into
version: "2"

run:
  # Cold-cache runs over the whole module need headroom.
  timeout: 5m

linters:
  default: standard
  enable:
    # Suggests modern language and library features - promoted out of gopls, so the
    # findings track the toolchain rather than one project's taste
    - modernize
    # Resource leaks that only show up as connection exhaustion in production, which is
    # the worst way to find them - all three were at or near zero when enabled
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - errorlint
  settings:
    modernize:
      # newexpr rewrites ptr(x) helpers onto Go 1.26's new(expr), which then makes govet's
      # inline check want every call site rewritten too - a cascade of churn for no behaviour
      disable:
        - newexpr
  exclusions:
    # Analyze generated files (sqlc, gqlgen) for the usage graph, but don't
    # report findings in them - we never hand-edit generated code.
    generated: lax
    presets:
      # Drops the universally-benign errcheck cases: deferred Close/Flush, fmt.Fprint* to stdout/stderr, os.Remove, etc.
      # Keeps errcheck focused on errors that actually matter
      - std-error-handling
    rules:
      # t.Fatal ends the goroutine, so a deref after a nil-guard in a test is unreachable and SA5011 does not model that
      - linters:
          - staticcheck
        text: SA5011
        path: _test\.go
      # QF1001 ("apply De Morgan's law") is a quickfix that often hurts readability as much as it helps
      - linters:
          - staticcheck
        text: QF1001
      # gqlgen writes resolver stubs with interface{} and rewrites them every codegen run, so
      # fixing these just makes the next skelet gen fail lint again - the signatures aren't ours
      - linters:
          - modernize
        text: interface\{\} can be replaced by any
        path: \.resolvers\.go$
