# Signals GraphQL surface, served by cmd/signals at POST /api/signals/graphql - separate from the admin one because these suites read the spine and the signals database, which cmd/server does not own
schema:
  - graph/schema/signals/*.graphqls

exec:
  package: signals
  layout: single-file
  filename: graph/signals/generated.go

model:
  filename: graph/signals/model/models_gen.go
  package: model

resolver:
  package: signals
  layout: follow-schema
  dir: graph/signals
  filename_template: "{name}.resolvers.go"
  # Same as the admin surface, where gqlgen's scaffolding comments are pure restatement and come back on every regen
  omit_template_comment: true

omit_gqlgen_file_notice: true

call_argument_directives_with_null: true

autobind:

models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
  # Same scalar bindings as the admin surface, so ported resolvers keep their signatures
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int32
  Int64:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
  Time:
    model:
      - github.com/99designs/gqlgen/graphql.Time
  JSON:
    model:
      - github.com/99designs/gqlgen/graphql.Any
