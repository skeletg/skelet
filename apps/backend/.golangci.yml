# golangci-lint configuration (v2 schema).
#
# This is a deliberate FLOOR, not a kitchen sink: the standard linter set
# (errcheck, govet, ineffassign, staticcheck, unused) is high-signal and
# low-noise. Ratchet up from here once it's green and stays green - good
# next additions are bodyclose, rowserrcheck (DB-heavy code), misspell,
# and a curated revive ruleset.
version: "2"

run:
  # Cold-cache runs over the whole module need headroom.
  timeout: 5m

linters:
  default: standard
  enable:
    # Suggests modern language and library features - promoted out of gopls, so the
    # findings track the toolchain rather than one project's taste
    - modernize
    # Resource leaks that only show up as connection exhaustion in production, which is
    # the worst way to find them - all three were at or near zero when enabled
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    # apperr classifies errors by unwrapping to a registered sentinel, so a %v instead of
    # %w silently drops the class - and an == comparison stops matching once anything wraps
    - errorlint
    # The plugin/SDK boundary - plugins compile in the same module, so nothing but this stops one importing internal/*
    # directly and coupling to surface with no compatibility contract (sdk/api.json covers the SDK alone)
    - depguard
  settings:
    depguard:
      rules:
        # Contract tests are exempt - they legitimately drive the host side
        plugin-sdk-boundary:
          files:
            - "**/plugins/**"
            - "!$test"
          deny:
            - pkg: github.com/skeletg/skelet/apps/backend/internal
              desc: plugins reach core only through the SDK - a SubscribeSync handler needing a domain's event shape is the one sanctioned exception, allow-listed here per package when it happens
    modernize:
      # newexpr rewrites ptr(x) helpers onto Go 1.26's new(expr), which then makes govet's
      # inline check want every call site rewritten too - a cascade of churn for no behaviour
      disable:
        - newexpr
  exclusions:
    # Analyze generated files (sqlc, gqlgen) for the usage graph, but don't
    # report findings in them - we never hand-edit generated code.
    generated: lax
    presets:
      # Drops the universally-benign errcheck cases: deferred Close/Flush, fmt.Fprint* to stdout/stderr, os.Remove, etc.
      # Keeps errcheck focused on errors that actually matter
      - std-error-handling
    rules:
      # QF1001 ("apply De Morgan's law") is an opinionated quickfix that
      # often hurts readability as much as it helps. Keep the SA correctness
      # checks; drop this one nag.
      # t.Fatal ends the goroutine, so the deref after a nil-guard in a test is
      # unreachable - SA5011 does not model that, and these only became visible when
      # modernize pulled test files into the analysis set
      - linters:
          - staticcheck
        text: SA5011
        path: _test\.go
      - linters:
          - staticcheck
        text: QF1001
      # gqlgen writes resolver stubs with interface{} and rewrites them every codegen run, so
      # fixing these just makes the next bin/codegen fail lint again - the signatures aren't ours
      - linters:
          - modernize
        text: interface\{\} can be replaced by any
        path: \.resolvers\.go$
