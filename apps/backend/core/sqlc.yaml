version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/db/migrations"
    queries: "internal/db/query"
    gen:
      go:
        package: "db"
        out: "internal/db/sqlc"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        # NUMERIC is used throughout for quantity columns (see migration 000109). Default sqlc mapping is string -
        # float64 is what every caller wants. Money stays in int64 cents; this override is only quantity-shaped
        overrides:
          - db_type: "numeric"
            go_type: "float64"
          - db_type: "pg_catalog.numeric"
            go_type: "float64"
          # Nullable NUMERIC would otherwise fall back to sql.NullString; scoped to the one column that wants a float
          # (other nullable numerics like location lat/long keep their NullString plumbing)
          - column: "catalog_product_option_values.forced_line_qty"
            go_type: "database/sql.NullFloat64"
            nullable: true
        rename:
          catalog_product: "Product"
          catalog_attribute: "Attribute"
          catalog_attribute_value: "AttributeValue"
          catalog_product_type: "ProductType"
          catalog_product_medium: "ProductMedium"
          catalog_product_child: "ProductChild"
          catalog_product_type_attribute: "ProductTypeAttribute"
          catalog_product_attribute_value: "ProductAttributeValue"
          catalog_product_configurable_option: "ProductConfigurableOption"
          catalog_product_content: "ProductContent"
          catalog_product_channel_listing: "ProductChannelListing"
          catalog_attribute_group: "AttributeGroup"
          catalog_collection: "Collection"
          catalog_collection_content: "CollectionContent"
          catalog_collection_product: "CollectionProduct"
